      :root {
        --chrome: #ffffff;
        --raised: #f2f0eb;
        --border: #e7e4dd;
        --text: #1c1b19;
        --muted: #67645e;
        --subtle: #9a968e;
        --primary: #1c1b19;
        --on-primary: #ffffff;
        --ok: #2f7d45;
        --select: #4c6fff;
        --shadow:
          0 1px 2px rgba(28, 27, 25, 0.06), 0 6px 18px rgba(28, 27, 25, 0.07);
        --hand: "Kalam", "Comic Neue", cursive;
        --sans: Inter, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root,
      #app {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        font-family: var(--sans);
        background: #fafaf7;
        color: #1c1b19;
        -webkit-font-smoothing: antialiased;
      }
      button {
        font: inherit;
        color: inherit;
      }
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      .app {
        position: fixed;
        inset: 0;
        overflow: hidden;
        font-size: 13px;
        color: var(--text);
        background: var(--chrome);
      }
      .app[data-theme="dark"] {
        --chrome: #191919;
        --raised: #242424;
        --border: #2a2a2a;
        --text: #ededec;
        --muted: #a3a3a1;
        --subtle: #767674;
        --primary: #ededec;
        --on-primary: #121212;
        --ok: #7fd39a;
        --select: #7c93ff;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 24px rgba(0, 0, 0, 0.45);
      }
      .app[data-style="chalkboard"] {
        --chrome: #232b27;
        --raised: #2c3530;
        --border: #3a443e;
        --text: #f4f1ea;
        --muted: #b9b5aa;
        --primary: #f2d675;
        --on-primary: #232b27;
      }
      .app[data-style="chalkboard"][data-theme="light"] {
        --chrome: #232b27;
        --raised: #2c3530;
        --border: #3a443e;
        --text: #f4f1ea;
        --muted: #b9b5aa;
      }

      /* board */
      .canvas {
        position: absolute;
        inset: 0;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
        background: var(--board, #fafaf7);
      }
      .canvas.tool-hand {
        cursor: grab;
      }
      .canvas.tool-hand.panning {
        cursor: grabbing;
      }
      .canvas.tool-shape {
        cursor: crosshair;
      }
      .canvas.tool-text {
        cursor: text;
      }
      .canvas.tool-pen {
        cursor: crosshair;
      }
      .canvas.tool-eraser {
        cursor: cell;
      }
      .grid {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .grid.on {
        opacity: 1;
      }
      .world {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        will-change: transform;
      }
      .edges {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
        pointer-events: none;
      }
      .edges .hit {
        pointer-events: stroke;
        cursor: pointer;
        stroke: transparent;
        fill: none;
        stroke-width: 18;
      }
      .node {
        position: absolute;
        transform-origin: 0 0;
        cursor: default;
        will-change: transform;
      }
      .node.selected {
        outline: none;
      }
      .sh {
        position: absolute;
        inset: 0;
        overflow: visible;
        pointer-events: none;
      }
      .sh svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        display: block;
      }
      .lbl {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 0 12px;
        text-align: center;
        line-height: 1.18;
        pointer-events: none;
        overflow: hidden;
        word-break: break-word;
      }
      .node.shape .lbl {
        font-size: 14px;
      }
      .node.text {
        background: transparent;
      }
      .node.text .lbl {
        align-items: flex-start;
        justify-content: flex-start;
        text-align: left;
        padding: 0;
        white-space: pre-wrap;
      }
      .node.text .lbl.center {
        justify-content: center;
        text-align: center;
      }
      .node.sticky {
        background: linear-gradient(160deg, #ffe680, #ffe066);
        box-shadow: 0 8px 16px -8px rgba(63, 54, 6, 0.38);
        border-radius: 3px;
      }
      .node.sticky .lbl {
        align-items: flex-start;
        justify-content: flex-start;
        text-align: left;
        padding: 14px 14px 20px;
        white-space: pre-wrap;
        font-family: var(--hand);
        font-size: 16px;
        color: #3f3606;
      }
      .node.sticky:after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        width: 20px;
        height: 20px;
        background: linear-gradient(
          135deg,
          rgba(0, 0, 0, 0.1),
          transparent 62%
        );
        border-bottom-left-radius: 2px;
      }
      .node.container .frame {
        position: absolute;
        inset: 0;
        border: 1.5px dashed var(--frame, #d4d0c7);
        border-radius: 12px;
        background: rgba(127, 127, 127, 0.02);
      }
      .node.container .clabel {
        position: absolute;
        left: 14px;
        top: -11px;
        padding: 0 6px;
        background: var(--board, #fafaf7);
        font-size: 12px;
        color: var(--frameText, #67645e);
        font-weight: 500;
        letter-spacing: 0.02em;
      }
      .node.slide {
        background: var(--slide, #fff);
        border: 1px solid var(--slideEdge, #e2ded4);
        border-radius: 3px;
        box-shadow: 0 2px 14px rgba(28, 27, 25, 0.1);
      }
      .node.slide .badge {
        position: absolute;
        left: 0;
        top: -26px;
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
      }
      .node.slide .badge b {
        display: inline-flex;
        width: 18px;
        height: 18px;
        align-items: center;
        justify-content: center;
        border-radius: 5px;
        background: var(--raised);
        margin-right: 6px;
        font-size: 10px;
      }
      .node.diagram {
        background: transparent;
      }
      .node.diagram svg {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      .node.image img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
      }
      .node .lockmark {
        position: absolute;
        right: -9px;
        top: -9px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--raised);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        color: var(--muted);
      }
      .node .icon {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* selection */
      .sel {
        position: absolute;
        display: none;
        pointer-events: none;
        border: 1.5px solid var(--select);
        border-radius: 2px;
        z-index: 20;
      }
      .sel.on {
        display: block;
      }
      .sel .h {
        position: absolute;
        width: 9px;
        height: 9px;
        background: #fff;
        border: 1.5px solid var(--select);
        border-radius: 2px;
        pointer-events: auto;
        transform: translate(-50%, -50%);
      }
      .sel .h[data-h="nw"] {
        left: 0;
        top: 0;
        cursor: nwse-resize;
      }
      .sel .h[data-h="n"] {
        left: 50%;
        top: 0;
        cursor: ns-resize;
      }
      .sel .h[data-h="ne"] {
        left: 100%;
        top: 0;
        cursor: nesw-resize;
      }
      .sel .h[data-h="e"] {
        left: 100%;
        top: 50%;
        cursor: ew-resize;
      }
      .sel .h[data-h="se"] {
        left: 100%;
        top: 100%;
        cursor: nwse-resize;
      }
      .sel .h[data-h="s"] {
        left: 50%;
        top: 100%;
        cursor: ns-resize;
      }
      .sel .h[data-h="sw"] {
        left: 0;
        top: 100%;
        cursor: nesw-resize;
      }
      .sel .h[data-h="w"] {
        left: 0;
        top: 50%;
        cursor: ew-resize;
      }
      .marquee {
        position: absolute;
        display: none;
        border: 1px dashed var(--select);
        background: rgba(76, 111, 255, 0.07);
        z-index: 19;
        pointer-events: none;
      }
      .marquee.on {
        display: block;
      }
      .laser {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 15;
      }

      /* chrome */
      .topleft {
        position: absolute;
        left: 16px;
        top: 16px;
        display: flex;
        gap: 8px;
        z-index: 5;
      }
      .topleft > .iconbtn {
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .pill {
        height: 40px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 14px 0 12px;
        border-radius: 10px;
        background: var(--chrome);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--hand);
        font-weight: 700;
        font-size: 20px;
        line-height: 1;
      }
      .divider {
        width: 1px;
        height: 18px;
        background: var(--border);
      }
      .boardname {
        font-weight: 500;
        color: var(--text);
        white-space: nowrap;
        max-width: 230px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .boardname-btn {
        cursor: pointer;
        border: 0;
        background: transparent;
        padding: 4px 6px;
        border-radius: 6px;
        font-weight: 500;
      }
      .boardname-btn:hover {
        background: var(--raised);
      }
      .saved {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
      }
      .dot-ok {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--ok);
      }
      .topright {
        position: absolute;
        right: 16px;
        top: 16px;
        display: flex;
        gap: 8px;
        z-index: 5;
        align-items: center;
      }
      .viewgroup {
        height: 40px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 3px;
        border-radius: 10px;
        background: var(--chrome);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }
      .seg {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .seg button {
        height: 32px;
        padding: 0 11px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
      }
      .seg button.is-on {
        background: var(--raised);
        color: var(--text);
      }
      .seg button.is-hand {
        font-family: var(--hand);
        font-size: 14px;
      }
      .vsep {
        width: 1px;
        height: 20px;
        background: var(--border);
        margin: 0 3px;
      }
      .iconbtn {
        width: 40px;
        height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        position: relative;
        flex: 0 0 auto;
      }
      .iconbtn:hover,
      .iconbtn.is-active {
        background: var(--raised);
      }
      .iconbtn:disabled {
        color: var(--subtle);
        cursor: default;
        background: transparent;
      }
      .iconbtn:focus-visible,
      .seg button:focus-visible,
      .primary:focus-visible {
        outline: 2px solid var(--select);
        outline-offset: 1px;
      }
      .iconbtn.small {
        width: 32px;
        height: 32px;
        border-radius: 8px;
      }
      .primary {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 40px;
        padding: 0 14px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: var(--on-primary);
        font-weight: 600;
        cursor: pointer;
      }
      .primary:hover {
        filter: brightness(1.06);
      }
      .primary:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .secondary {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 11px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--chrome);
        color: var(--text);
        font-weight: 500;
        cursor: pointer;
      }
      .secondary:hover {
        background: var(--raised);
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #e7c26a;
        color: #2b2504;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 13px;
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
      .chipbtn {
        height: 40px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 0 12px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--chrome);
        cursor: pointer;
        font-weight: 500;
        box-shadow: var(--shadow);
      }
      .chipbtn:hover {
        background: var(--raised);
      }

      /* toolbar + rail */
      .toolbar {
        position: absolute;
        left: 16px;
        top: 72px;
        width: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 4px;
        z-index: 5;
        background: var(--chrome);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
      }
      .toolbar .sep {
        width: 24px;
        height: 1px;
        margin: 4px 0;
        background: var(--border);
      }
      .rail {
        position: absolute;
        top: 72px;
        width: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 4px;
        z-index: 5;
        background: var(--chrome);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        transition: right 0.18s ease;
      }
      .rail .aibtn {
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.02em;
      }
      .bottomleft {
        position: absolute;
        left: 16px;
        bottom: 16px;
        display: flex;
        gap: 8px;
        z-index: 5;
      }
      .group {
        height: 40px;
        display: flex;
        align-items: center;
        padding: 0 4px;
        border-radius: 10px;
        background: var(--chrome);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }
      .group .iconbtn {
        width: 32px;
        height: 32px;
        border-radius: 7px;
      }
      .zoomlabel {
        min-width: 52px;
        height: 32px;
        border: 0;
        background: transparent;
        color: var(--text);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        cursor: pointer;
        border-radius: 7px;
      }
      .textbtn {
        height: 32px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 0 8px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-weight: 500;
      }
      .textbtn.is-active {
        background: var(--raised);
        color: var(--text);
      }
      .contextbar {
        position: absolute;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        min-height: 44px;
        display: flex;
        align-items: center;
        gap: 3px;
        padding: 4px 6px;
        white-space: nowrap;
        z-index: 6;
        background: var(--chrome);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
      }
      .contextbar .iconbtn {
        width: 32px;
        height: 32px;
      }
      .count {
        padding: 0 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .chip {
        height: 32px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: var(--raised);
        color: var(--text);
        cursor: pointer;
        font-weight: 500;
      }
      .swatch {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        border: 1.4px solid #999;
        display: inline-block;
        flex: 0 0 auto;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 11px;
      }

      /* panels */
      .sidepanel {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: 400px;
        display: flex;
        flex-direction: column;
        background: var(--chrome);
        border-left: 1px solid var(--border);
        z-index: 6;
        box-shadow: -10px 0 30px -24px rgba(0, 0, 0, 0.35);
      }
      .sidepanel header {
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 8px 0 18px;
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
      }
      .sidetitle {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
      }
      .sidehead-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .sidebody {
        flex: 1;
        overflow: auto;
        padding: 14px 16px;
      }
      .sideempty {
        padding: 34px 22px;
        color: var(--muted);
        line-height: 1.55;
      }
      .sideempty p {
        margin: 0 0 10px;
      }
      .field {
        display: block;
        margin-bottom: 12px;
      }
      .field > span {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin-bottom: 6px;
        font-weight: 600;
      }
      .input,
      select.input,
      textarea.input {
        width: 100%;
        min-height: 34px;
        padding: 7px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--chrome);
        color: var(--text);
        outline: none;
      }
      .input:focus {
        border-color: var(--select);
        box-shadow: 0 0 0 3px rgba(76, 111, 255, 0.12);
      }
      textarea.input {
        resize: vertical;
        line-height: 1.45;
      }
      .codearea {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        line-height: 1.5;
        min-height: 300px;
        white-space: pre;
        tab-size: 2;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      .row.end {
        justify-content: flex-end;
      }
      .section-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 16px 0 8px;
      }
      .note {
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
        margin: 8px 0 0;
      }
      .diag {
        font-size: 12px;
        padding: 7px 9px;
        border-radius: 7px;
        margin: 4px 0;
        background: var(--raised);
        border-left: 3px solid var(--subtle);
        line-height: 1.4;
      }
      .diag.error {
        border-left-color: #d04a69;
        color: #a82c48;
      }
      .diag.warning {
        border-left-color: #d9a406;
        color: #7a5c00;
      }
      .diag.info {
        border-left-color: var(--select);
      }
      .kv {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
        font-size: 12px;
      }
      .kv:last-child {
        border-bottom: 0;
      }

      /* slides */
      .slides-count {
        font-size: 11px;
        padding: 1px 6px;
        border-radius: 20px;
        background: var(--raised);
        color: var(--muted);
        font-weight: 600;
      }
      .slides-headactions {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .slides-present {
        height: 30px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: var(--on-primary);
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
      }
      .slides-present:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .slides-tools {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 0 0 auto;
      }
      .slides-add {
        position: relative;
      }
      .slides-tool {
        height: 32px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--chrome);
        font-weight: 500;
        cursor: pointer;
        font-size: 12px;
      }
      .slides-tool.is-primary {
        background: var(--primary);
        color: var(--on-primary);
        border-color: transparent;
      }
      .slides-tool.is-ghost {
        border-color: transparent;
        color: var(--muted);
      }
      .slides-tool:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .layoutpicker {
        position: absolute;
        left: 0;
        top: 38px;
        z-index: 20;
        width: 230px;
        padding: 6px;
        background: var(--chrome);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow);
      }
      .layoutpicker button {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        cursor: pointer;
        text-align: left;
        font-size: 12px;
      }
      .layoutpicker button:hover {
        background: var(--raised);
      }
      .layoutglyph {
        width: 42px;
        height: 26px;
        border: 1px solid var(--border);
        border-radius: 3px;
        background: var(--raised);
        position: relative;
        flex: 0 0 auto;
        overflow: hidden;
      }
      .layoutglyph i {
        position: absolute;
        background: var(--subtle);
        border-radius: 1px;
        display: block;
      }
      .slides-list {
        flex: 1;
        overflow: auto;
        padding: 12px 14px 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .slides-empty {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }
      .slides-empty p {
        margin: 0 0 8px;
      }
      .slidecard {
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        background: var(--chrome);
        transition: border-color 0.12s;
      }
      .slidecard.is-active {
        border-color: var(--select);
        box-shadow: 0 0 0 2px rgba(76, 111, 255, 0.14);
      }
      .slidecard-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 8px;
        border-bottom: 1px solid var(--border);
      }
      .slidecard-num {
        width: 20px;
        height: 20px;
        border-radius: 5px;
        background: var(--raised);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 700;
        color: var(--muted);
        flex: 0 0 auto;
      }
      .slidecard-title {
        flex: 1;
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        background: transparent;
        border: 0;
        padding: 2px 4px;
        border-radius: 4px;
        text-align: left;
        cursor: text;
      }
      .slidecard-title:hover {
        background: var(--raised);
      }
      .slidecard-actions {
        display: flex;
        gap: 1px;
      }
      .slidecard-actions .iconbtn {
        width: 24px;
        height: 24px;
        border-radius: 5px;
      }
      .slidethumb {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        background: #fff;
        overflow: hidden;
        cursor: pointer;
      }
      .slidethumb .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        transform-origin: 0 0;
      }
      .slidethumb-scene {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .notes {
        padding: 8px 10px;
        border-top: 1px solid var(--border);
      }
      .notes textarea {
        width: 100%;
        border: 0;
        background: transparent;
        resize: vertical;
        min-height: 34px;
        font-size: 12px;
        color: var(--muted);
        outline: none;
      }

      /* present */
      .present {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #050505;
        overflow: hidden;
        cursor: default;
      }
      .present.hidecursor {
        cursor: none;
      }
      .present-stage {
        position: absolute;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5);
        border-radius: 2px;
      }
      .present-stage .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .present-progress {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 3px;
        background: rgba(255, 255, 255, 0.14);
      }
      .present-progress i {
        display: block;
        height: 100%;
        background: #f2d675;
        transition: width 0.2s;
      }
      .present-bar {
        position: absolute;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border-radius: 12px;
        background: rgba(20, 20, 20, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: #fff;
        backdrop-filter: blur(10px);
        opacity: 0;
        transition: opacity 0.2s;
      }
      .present.show .present-bar {
        opacity: 1;
      }
      .present-bar button {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .present-bar button:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      .present-bar button:disabled {
        opacity: 0.3;
      }
      .present-count {
        font-size: 12px;
        padding: 0 6px;
        font-variant-numeric: tabular-nums;
        color: rgba(255, 255, 255, 0.86);
      }
      .present-sep {
        width: 1px;
        height: 18px;
        background: rgba(255, 255, 255, 0.2);
      }
      .present .laser {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      /* overlays */
      .scrim {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: rgba(20, 20, 18, 0.34);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .modal {
        width: min(520px, 100%);
        max-height: min(86vh, 780px);
        display: flex;
        flex-direction: column;
        background: var(--chrome);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.4);
        overflow: hidden;
      }
      .modal.wide {
        width: min(720px, 100%);
      }
      .modal header {
        height: 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px 0 18px;
        border-bottom: 1px solid var(--border);
        flex: 0 0 auto;
      }
      .modal header h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      .modal-body {
        padding: 16px 18px;
        overflow: auto;
      }
      .modal-foot {
        padding: 12px 18px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        flex: 0 0 auto;
      }
      .sheet {
        width: min(760px, 100%);
        max-height: 86vh;
        background: var(--chrome);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        overflow: auto;
        padding: 20px 24px;
      }
      .sheet h2 {
        margin: 0 0 16px;
        font-size: 17px;
      }
      .sheet-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px 34px;
      }
      .sheet-grid h3 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .sheet-grid dl {
        margin: 0;
      }
      .sheet-grid .row2 {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 5px 0;
        border-bottom: 1px solid var(--border);
      }
      .sheet-grid dt {
        font-size: 12px;
      }
      .sheet-grid dd {
        margin: 0;
        display: flex;
        gap: 4px;
      }
      kbd {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 10px;
        padding: 2px 5px;
        border: 1px solid var(--border);
        border-bottom-width: 2px;
        border-radius: 4px;
        background: var(--raised);
        color: var(--muted);
      }
      .sheet-foot {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
        margin: 18px 0 0;
      }

      /* palette */
      .palette {
        width: min(560px, 100%);
        background: var(--chrome);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.4);
        overflow: hidden;
      }
      .palette input {
        width: 100%;
        height: 52px;
        border: 0;
        border-bottom: 1px solid var(--border);
        background: transparent;
        padding: 0 18px;
        font-size: 15px;
        outline: none;
      }
      .palette-list {
        max-height: min(52vh, 420px);
        overflow: auto;
        padding: 6px;
      }
      .palette-item {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 9px 12px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        cursor: pointer;
        text-align: left;
      }
      .palette-item.is-cursor {
        background: var(--raised);
      }
      .palette-item .g {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .palette-empty {
        padding: 22px;
        color: var(--muted);
        text-align: center;
      }

      /* icon search */
      .iconsearch {
        width: min(680px, 100%);
        background: var(--chrome);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        max-height: 78vh;
      }
      .iconsearch-field {
        height: 52px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
      }
      .iconsearch-field input {
        flex: 1;
        height: 100%;
        border: 0;
        outline: none;
        background: transparent;
        font-size: 14px;
      }
      .iconsearch-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
        gap: 6px;
        padding: 12px;
        overflow: auto;
      }
      .iconsearch-glyph {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 10px 6px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        cursor: pointer;
        color: var(--text);
      }
      .iconsearch-glyph:hover,
      .iconsearch-glyph.is-cursor {
        background: var(--raised);
      }
      .iconsearch-glyph small {
        font-size: 10px;
        color: var(--muted);
        text-align: center;
        line-height: 1.2;
      }
      .iconsearch-empty {
        padding: 28px;
        text-align: center;
        color: var(--muted);
      }
      .iconsearch-foot {
        padding: 9px 14px;
        border-top: 1px solid var(--border);
        font-size: 11px;
        color: var(--muted);
        display: flex;
        justify-content: space-between;
      }

      /* export */
      .export-body {
        display: flex;
        gap: 18px;
        padding: 16px 18px;
      }
      .export-preview {
        width: 46%;
        aspect-ratio: 4/3;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: repeating-conic-gradient(#8881 0 25%, transparent 0 50%) 0
          0/16px 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex: 0 0 auto;
      }
      .export-preview img {
        max-width: 100%;
        max-height: 100%;
        display: block;
      }
      .export-opts {
        flex: 1;
        min-width: 0;
      }
      fieldset {
        border: 0;
        margin: 0 0 12px;
        padding: 0;
      }
      legend {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .seginline {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .seginline button {
        height: 30px;
        padding: 0 9px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
      }
      .seginline button.is-on {
        background: var(--raised);
        color: var(--text);
        border-color: var(--subtle);
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        margin: 8px 0;
        color: var(--text);
      }
      .check input {
        accent-color: var(--primary);
      }
      .export-size {
        font-size: 11px;
        color: var(--muted);
        margin: 10px 0 0;
      }

      /* boards */
      .boardlist {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .boarditem {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 8px;
        border-radius: 8px;
        cursor: pointer;
      }
      .boarditem:hover {
        background: var(--raised);
      }
      .boarditem.is-current {
        background: var(--raised);
      }
      .boarditem .bt {
        flex: 1;
        min-width: 0;
      }
      .boarditem .bt b {
        display: block;
        font-size: 12.5px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .boarditem .bt small {
        color: var(--muted);
        font-size: 11px;
      }
      .thumbmini {
        width: 52px;
        height: 32px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: #fff;
        overflow: hidden;
        position: relative;
        flex: 0 0 auto;
      }
      .thumbmini .scene {
        position: absolute;
        transform-origin: 0 0;
        pointer-events: none;
      }

      /* start */
      .start {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 4;
        width: min(640px, calc(100% - 32px));
        padding: 18px;
        border-radius: 16px;
        background: var(--chrome);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
      }
      .start-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 10px;
        margin: 0 2px 14px;
      }
      .start-head strong {
        font-size: 15px;
      }
      .start-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }
      .start-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        padding: 14px 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--chrome);
        cursor: pointer;
        text-align: left;
        transition:
          transform 0.12s,
          border-color 0.12s;
      }
      .start-card:hover {
        transform: translateY(-1px);
        border-color: var(--subtle);
      }
      .start-icon {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: var(--raised);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 4px;
      }
      .start-title {
        font-weight: 600;
        font-size: 13px;
      }
      .start-blurb {
        font-size: 11.5px;
        color: var(--muted);
        line-height: 1.4;
      }
      .start-blank {
        margin-top: 10px;
        width: 100%;
        height: 38px;
        border: 1px dashed var(--border);
        border-radius: 10px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .start-blank:hover {
        border-color: var(--subtle);
        color: var(--text);
      }

      /* chat */
      .chat {
        flex: 1;
        overflow: auto;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .chat-empty {
        color: var(--muted);
        font-size: 12.5px;
        line-height: 1.55;
      }
      .chat-empty p {
        margin: 0 0 12px;
      }
      .suggest {
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-start;
      }
      .suggest-chip {
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--chrome);
        color: var(--text);
        font-size: 12px;
        cursor: pointer;
        text-align: left;
      }
      .suggest-chip:hover {
        background: var(--raised);
      }
      .msg-user {
        align-self: flex-end;
        max-width: 88%;
        padding: 8px 11px;
        border-radius: 12px 12px 3px 12px;
        background: var(--primary);
        color: var(--on-primary);
        font-size: 12.5px;
        line-height: 1.45;
        white-space: pre-wrap;
      }
      .msg-ai {
        align-self: flex-start;
        max-width: 92%;
        padding: 8px 11px;
        border-radius: 12px 12px 12px 3px;
        background: var(--raised);
        font-size: 12.5px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      .msg-tool {
        align-self: flex-start;
        font-size: 11px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .msg-error {
        align-self: stretch;
        padding: 8px 11px;
        border-radius: 8px;
        background: #fde7ea;
        color: #8d2337;
        font-size: 12px;
        border-left: 3px solid #d04a69;
      }
      .composer {
        padding: 10px 12px;
        border-top: 1px solid var(--border);
        flex: 0 0 auto;
      }
      .composer textarea {
        width: 100%;
        min-height: 52px;
        max-height: 140px;
        resize: none;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 9px 10px;
        outline: none;
        background: var(--chrome);
        color: var(--text);
        line-height: 1.45;
      }
      .composer textarea:focus {
        border-color: var(--select);
        box-shadow: 0 0 0 3px rgba(76, 111, 255, 0.12);
      }
      .composer-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 7px;
      }
      .hint {
        font-size: 10.5px;
        color: var(--muted);
      }
      .sendbtn {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 8px;
        background: var(--primary);
        color: var(--on-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .sendbtn:disabled {
        opacity: 0.35;
        cursor: default;
      }
      .linkbtn {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        cursor: pointer;
        padding: 0;
        text-decoration: underline;
        margin-top: 6px;
      }
      .modelchip {
        height: 28px;
        font-size: 11px;
        padding: 0 9px;
        border-radius: 7px;
      }
      .provider-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .provider {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        padding: 11px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--chrome);
        cursor: pointer;
        text-align: left;
      }
      .provider.is-on {
        border-color: var(--select);
        box-shadow: 0 0 0 2px rgba(76, 111, 255, 0.12);
      }
      .provider-name {
        font-weight: 600;
        font-size: 12.5px;
      }
      .provider-sub {
        font-size: 11px;
        color: var(--muted);
      }

      /* toast / misc */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 78px;
        transform: translateX(-50%);
        z-index: 120;
        padding: 9px 14px;
        border-radius: 9px;
        background: var(--primary);
        color: var(--on-primary);
        font-size: 12.5px;
        box-shadow: var(--shadow);
        pointer-events: none;
        animation: toastin 0.18s ease;
      }
      @keyframes toastin {
        from {
          opacity: 0;
          transform: translate(-50%, 6px);
        }
      }
      .hidden {
        display: none !important;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }
      .texteditor {
        position: absolute;
        z-index: 30;
        margin: 0;
        border: 1.5px solid var(--select);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.96);
        color: #1c1b19;
        resize: none;
        outline: none;
        overflow: hidden;
        padding: 0;
        font-family: var(--sans);
      }
      .replay {
        position: fixed;
        inset: 0;
        z-index: 90;
        background: rgba(8, 8, 8, 0.86);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        backdrop-filter: blur(3px);
      }
      .replay .scene-wrap {
        position: relative;
        border-radius: 8px;
        overflow: hidden;
        background: var(--board, #fafaf7);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
      }
      .replay .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .replay-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 12px;
        background: rgba(24, 24, 24, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: #fff;
      }
      .replay-bar button {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: #fff;
        cursor: pointer;
      }
      .replay-bar button:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      .replay-track {
        width: min(460px, 60vw);
        height: 6px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.2);
        position: relative;
        cursor: pointer;
      }
      .replay-track i {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        border-radius: 4px;
        background: #f2d675;
      }
      .replay-label {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.75);
        min-width: 90px;
        text-align: right;
      }
      .cleanit {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .spin {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* svg icons helper */
      .ic {
        display: inline-block;
        vertical-align: middle;
        flex: 0 0 auto;
      }

      @media (max-width: 760px) {
        .start-grid {
          grid-template-columns: 1fr;
        }
        .sidepanel {
          width: 100%;
        }
        .topright .viewgroup .seg {
          display: none;
        }
        .export-body {
          flex-direction: column;
        }
        .export-preview {
          width: 100%;
        }
        .sheet-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ---------- Sands of Time ---------- */
      .rail .iconbtn {
        position: relative;
      }
      .rail .iconbtn.is-rec {
        color: #e5544b;
        background: rgba(229, 84, 75, 0.12);
        animation: sotpulse 1.6s ease-in-out infinite;
      }
      .rail .iconbtn.is-rec:hover {
        background: rgba(229, 84, 75, 0.2);
      }
      .rail .railcount {
        position: absolute;
        top: -4px;
        right: -4px;
        min-width: 15px;
        height: 15px;
        padding: 0 4px;
        border-radius: 8px;
        background: var(--primary);
        color: var(--on-primary);
        font-size: 9px;
        font-weight: 700;
        line-height: 15px;
        text-align: center;
        box-shadow: 0 0 0 2px var(--chrome);
      }
      @keyframes sotpulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(229, 84, 75, 0.35);
        }
        50% {
          box-shadow: 0 0 0 5px rgba(229, 84, 75, 0);
        }
      }

      #sotRoot {
        position: fixed;
        top: 72px;
        right: 76px;
        z-index: 9;
      }
      .sotcard {
        width: 248px;
        background: var(--chrome);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 8px 9px 7px;
        font-family: var(--sans);
        color: var(--ink);
      }
      .sotcard-head {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 1px 1px 7px;
      }
      .sotcard-title {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .sotcard-count {
        min-width: 17px;
        height: 17px;
        padding: 0 5px;
        border-radius: 9px;
        background: var(--raised);
        color: var(--muted);
        font-size: 10px;
        font-weight: 700;
        line-height: 17px;
        text-align: center;
      }
      .sotcard-head .sotghost {
        margin-left: auto;
      }
      .sotlist {
        list-style: none;
        margin: 0;
        padding: 0;
        border-top: 1px solid var(--border);
      }
      .sotrow {
        display: flex;
        align-items: center;
        gap: 2px;
        border-bottom: 1px solid var(--border);
        padding: 2px 0;
      }
      .sotrow-main {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
        background: transparent;
        border: 0;
        padding: 6px 4px;
        border-radius: 6px;
        cursor: pointer;
        color: var(--ink);
        text-align: left;
        min-width: 0;
      }
      .sotrow-main:hover {
        background: var(--raised);
      }
      .sotrow-play {
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #f0c655;
        color: #3b2f05;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .sotrow-name {
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sotrow-meta {
        margin-left: auto;
        font-size: 10.5px;
        color: var(--muted);
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .sotrow-del {
        width: 24px;
        height: 24px;
        border: 0;
        background: transparent;
        color: var(--muted);
        border-radius: 6px;
        cursor: pointer;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .sotrow-del:hover {
        background: rgba(229, 84, 75, 0.12);
        color: #e5544b;
      }
      .sotempty {
        margin: 7px 3px 9px;
        font-size: 11.5px;
        line-height: 1.45;
        color: var(--muted);
      }
      .sotnew {
        width: 100%;
        margin-top: 7px;
        padding: 7px 8px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font-size: 11.5px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }
      .sotnew:hover {
        background: var(--raised);
        color: var(--ink);
      }
      .sotnew .recdot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: linear-gradient(180deg, #ef5a50, #d63a30);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08);
      }
      .sotghost {
        width: 26px;
        height: 26px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }
      .sotghost:hover {
        background: var(--raised);
        color: var(--ink);
      }
      .sotghost:disabled {
        opacity: 0.28;
        cursor: default;
      }

      #sotDim {
        position: fixed;
        inset: 0;
        z-index: 4;
        background: rgba(18, 18, 16, 0.22);
        backdrop-filter: saturate(0.75);
      }
      #sotReplayRoot {
        position: fixed;
        inset: 0;
        z-index: 7;
        pointer-events: none;
      }
      .sotreplay {
        position: absolute;
        inset: 0;
        font-family: var(--sans);
        color: var(--ink);
      }
      .sottop {
        position: absolute;
        top: 13px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 7px 14px;
        border-radius: 999px;
        background: var(--chrome);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        pointer-events: auto;
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      .sottop-name {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--ink);
        font-weight: 600;
        font-size: 12px;
      }
      .sotkey {
        display: inline-flex;
        align-items: center;
        gap: 3px;
      }
      .sotkey kbd {
        font-family: var(--sans);
        font-size: 10px;
        line-height: 1;
        padding: 3px 5px;
        border-radius: 4px;
        background: var(--raised);
        border: 1px solid var(--border);
        color: var(--ink);
      }
      .sotstage {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        overflow: hidden;
        border-radius: 8px;
        background: var(--board);
        box-shadow: 0 24px 70px -10px rgba(0, 0, 0, 0.35);
        pointer-events: none;
      }
      .sotstage .scene {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .sotbar {
        position: absolute;
        left: 50%;
        bottom: 15px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 5px 8px;
        border-radius: 14px;
        background: var(--chrome);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        pointer-events: auto;
        font-size: 11.5px;
        white-space: nowrap;
        z-index: 2;
      }
      .sotbar button {
        border: 0;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 28px;
        height: 28px;
        padding: 0 5px;
        font-size: 11.5px;
        font-family: var(--sans);
      }
      .sotbar button:hover {
        background: var(--raised);
      }
      .sotbar button:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .sotplay {
        background: #f0c655 !important;
        color: #352a04 !important;
        border-radius: 50% !important;
        width: 34px !important;
        height: 34px !important;
        min-width: 34px !important;
      }
      .sotplay:hover {
        background: #f6d36e !important;
      }
      .sotpos {
        font-variant-numeric: tabular-nums;
        color: var(--muted);
        min-width: 32px;
        text-align: center;
      }
      .sotrange {
        width: min(300px, 32vw);
        accent-color: var(--primary);
        margin: 0 2px;
      }
      .sotlabel {
        color: var(--muted);
        max-width: 130px;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 40px;
      }
      .sotsep {
        width: 1px;
        height: 18px;
        background: var(--border);
        margin: 0 4px;
      }
      .sotexport {
        color: var(--muted);
        font-size: 10.5px;
        min-width: 0;
        font-variant-numeric: tabular-nums;
      }
      .sotexport-menu {
        position: absolute;
        bottom: 52px;
        right: 62px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 5px;
        background: var(--chrome);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow);
        min-width: 206px;
      }
      .sotexport-menu button {
        display: flex;
        align-items: center;
        gap: 9px;
        justify-content: flex-start;
        text-align: left;

      function arrowGeom(el) {
        const th = theme();
        const sEl = el.start?.elementId
          ? S.doc.elements[el.start.elementId]
          : null;
        const tEl = el.end?.elementId ? S.doc.elements[el.end.elementId] : null;
        const pts = el.points || [
          { x: 0, y: 0 },
          { x: 100, y: 0 },
        ];
        const first = {
          x: el.x + (pts[0]?.x ?? 0),
          y: el.y + (pts[0]?.y ?? 0),
        };
        const last = {
          x: el.x + (pts[pts.length - 1]?.x ?? 0),
          y: el.y + (pts[pts.length - 1]?.y ?? 0),
        };
        let p0 = first,
          p1 = last;
        if (sEl) p0 = anchorPoint(sEl, tEl ? centerOf(tEl) : last);
        if (tEl) p1 = anchorPoint(tEl, sEl ? centerOf(sEl) : first);
        let d = "",
          labelPoint = { x: (p0.x + p1.x) / 2, y: (p0.y + p1.y) / 2 };
        const mode = el.routeMode || "orthogonal";
        if (mode === "straight") {
          d = `M${p0.x} ${p0.y} L${p1.x} ${p1.y}`;
        } else if (mode === "curved") {
          if (Math.abs(p1.x - p0.x) >= Math.abs(p1.y - p0.y)) {
            const mx = (p0.x + p1.x) / 2;
            d = `M${p0.x} ${p0.y} C${mx} ${p0.y} ${mx} ${p1.y} ${p1.x} ${p1.y}`;
          } else {
            const my = (p0.y + p1.y) / 2;
            d = `M${p0.x} ${p0.y} C${p0.x} ${my} ${p1.x} ${my} ${p1.x} ${p1.y}`;
          }
        } else {
          if (Math.abs(p1.x - p0.x) >= Math.abs(p1.y - p0.y)) {
            if (Math.abs(p1.y - p0.y) < 1) d = `M${p0.x} ${p0.y} H${p1.x}`;
            else {
              const mx = (p0.x + p1.x) / 2;
              d = `M${p0.x} ${p0.y} H${mx} V${p1.y} H${p1.x}`;
              labelPoint = { x: mx, y: (p0.y + p1.y) / 2 };
            }
          } else {
            if (Math.abs(p1.x - p0.x) < 1) d = `M${p0.x} ${p0.y} V${p1.y}`;
            else {
              const my = (p0.y + p1.y) / 2;
              d = `M${p0.x} ${p0.y} V${my} H${p1.x} V${p1.y}`;

      function arrowHead(geom, end, color) {
        const { p0, p1 } = geom;
        const a = end === "end" ? p1 : p0;
        const b = end === "end" ? p0 : p1;
        const ang = Math.atan2(a.y - b.y, a.x - b.x);
        const len = 10,
          wid = 4.4;
        const x1 = a.x - len * Math.cos(ang) + wid * Math.sin(ang);
        const y1 = a.y - len * Math.sin(ang) - wid * Math.cos(ang);
        const x2 = a.x - len * Math.cos(ang) - wid * Math.sin(ang);
        const y2 = a.y - len * Math.sin(ang) + wid * Math.cos(ang);
        return `<path d="M${a.x} ${a.y} L${x1} ${y1} L${x2} ${y2} Z" fill="${color}"/>`;
      }
      function centerOf(e) {
        const b = elementBounds(e);
        return { x: (b.minX + b.maxX) / 2, y: (b.minY + b.maxY) / 2 };

      function anchorPoint(e, toward) {
        const b = elementBounds(e);
        const cx = (b.minX + b.maxX) / 2,

        const dx = toward.x - cx,
          dy = toward.y - cy;

        const hw = Math.max(1, (b.maxX - b.minX) / 2),

      function estimateTextHeight(text, width, size) {

      function nextSlidePos() {

      async function sendAI(text) {
        if (!text.trim()) return;
        const ai = currentAI();
        if (!ai.key) {
          S.connectOpen = true;
          renderOverlays();
          return;
        }
        if (S.assistant.busy) return;
        pushMsg({ kind: "user", text });
        S.assistant.busy = true;
        S.assistant.abort = new AbortController();
        renderPanel();
        try {
          const content = await callAI(ai, text, S.assistant.abort.signal);
          let data = null;
          try {
            data = JSON.parse(extractJSON(content));
          } catch {
            data = null;
          }
          if (!data) {
            pushMsg({ kind: "ai", text: String(content).slice(0, 1400) });
          } else {
            if (data.reply) pushMsg({ kind: "ai", text: data.reply });
            for (const a of data.actions || []) {
              if (a.type === "diagram" && a.dsl) {
                pushMsg({
                  kind: "tool",
                  text: `Created diagram “${a.title || "Diagram"}”`,
                });

          S.assistant.busy = false;

      function extractJSON(txt) {
        let s = String(txt).trim();
        s = s
          .replace(/^```(?:json)?\s*/i, "")
          .replace(/```$/i, "")
          .trim();
        const a = s.indexOf("{"),
          b = s.lastIndexOf("}");
        if (a >= 0 && b > a) s = s.slice(a, b + 1);
        return s;
      }
      async function callAI(ai, text, signal) {
        const cfg = aiConfig();
        const history = S.assistant.messages
          .filter((m) => m.kind === "user" || m.kind === "ai")
          .slice(-8)
          .map((m) => `${m.kind === "user" ? "User" : "Assistant"}: ${m.text}`)
          .join("\n");
        const prompt = history ? `${history}\nUser: ${text}` : text;
        if (ai.provider === "anthropic") {
          const r = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            signal,
            headers: {
              "content-type": "application/json",
              "x-api-key": ai.key,
              "anthropic-version": "2023-06-01",
              "anthropic-dangerous-direct-browser-access": "true",
            },
            body: JSON.stringify({
              model: ai.model,
              max_tokens: 2400,
              system: SYSTEM_PROMPT,
              messages: [{ role: "user", content: prompt }],
            }),
          });
          const j = await r.json();
          if (!r.ok)
            throw new Error(j?.error?.message || `Anthropic error ${r.status}`);
          return j.content?.map((c) => c.text).join("") || "";
        }
        if (ai.provider === "google") {
          const r = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(ai.model)}:generateContent?key=${encodeURIComponent(ai.key)}`,
            {
              method: "POST",
              signal,
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
                contents: [{ role: "user", parts: [{ text: prompt }] }],
              }),
            },
          );
          const j = await r.json();
          if (!r.ok)
            throw new Error(j?.error?.message || `Google error ${r.status}`);
          return (
            j.candidates?.[0]?.content?.parts?.map((p) => p.text).join("") || ""
          );
        }
        const base =
          ai.provider === "openai-compatible"
            ? cfg.baseUrl || "https://openrouter.ai/api/v1"
            : "https://api.openai.com/v1";
        const r = await fetch(base.replace(/\/$/, "") + "/chat/completions", {
          method: "POST",
          signal,
          headers: {
            "content-type": "application/json",
            authorization: `Bearer ${ai.key}`,
          },
          body: JSON.stringify({
            model: ai.model,
            messages: [
              { role: "system", content: SYSTEM_PROMPT },
              { role: "user", content: prompt },
            ],
            temperature: 0.3,
          }),
        });
        const j = await r.json();
        if (!r.ok)
          throw new Error(j?.error?.message || `Provider error ${r.status}`);
        return j.choices?.[0]?.message?.content || "";
      }

      /* ============================================================

      function present(index = 0) {
        const list = slides();
        if (!list.length) return toast("Add a slide first");
        S.present = {
          index: clamp(index, 0, list.length - 1),
          steps: 0,
          chrome: true,
          laser: false,
        };

        document.documentElement.requestFullscreen?.().catch(() => {});
      }
      function exitPresent() {
        S.present = null;

          document.exitFullscreen?.().catch(() => {});
        renderChrome();
      }
      function presentNav(delta) {
        if (!S.present) return;
        const list = slides();
        const p = S.present;
        if (delta > 0) {
          const sl = list[p.index];
          if (sl && (sl.builds || []).length > p.steps) {
            p.steps++;
            renderPresent();
            return;
          }
          if (p.index < list.length - 1) {
            p.index++;
            p.steps = 0;
            renderPresent();
          }
        } else {
          if (p.steps > 0) {
            p.steps--;
            renderPresent();
            return;
          }
          if (p.index > 0) {
            p.index--;
            p.steps = 0;
            renderPresent();
          }
        }
      }
      function renderPresent() {
        const root = $("#presentRoot");
        const list = slides();
        if (!S.present || !list.length) {
          root.innerHTML = "";
          return;
        }
        const p = S.present;
        const sl = list[p.index];
        if (!sl) {
          exitPresent();
          return;
        }
        const vw = innerWidth,
          vh = innerHeight;
        const scale = Math.min((vw - 96) / SLIDE_W, (vh - 120) / SLIDE_H);
        const w = SLIDE_W * scale,
          h = SLIDE_H * scale;
        const left = (vw - w) / 2,
          top = (vh - h) / 2;
        const builds = sl.builds || [];
        const hidden = new Set(builds.slice(p.steps));
        const total = list.length;
        root.innerHTML = `
    <div class="present ${p.chrome ? "show" : "hidecursor"}" id="present" role="dialog" aria-label="Presenting slide ${p.index + 1} of ${total}">
      <div class="present-stage" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px;background:${theme().slide}">
        <div class="scene" style="width:${SLIDE_W}px;height:${SLIDE_H}px;transform:scale(${scale});transform-origin:0 0" id="presentScene"></div>
      </div>
      <div class="present-progress"><i style="width:${((p.index + 1) / total) * 100}%"></i></div>
      <div class="present-bar">
        <button data-act="presentPrev" title="Previous" ${p.index === 0 && !p.steps ? "disabled" : ""}>${ico("prev", 16)}</button>
        <span class="present-count">${p.index + 1} / ${total}</span>
        <button data-act="presentNext" title="Next">${ico("next", 16)}</button>
        <span class="present-sep"></span>
        <button data-act="presentLaser" title="Laser pointer (L)" style="${p.laser ? "background:rgba(255,255,255,.18)" : ""}">${ico("laser", 16)}</button>
        <button data-act="presentExit" title="Exit (Esc)">${ico("close", 16)}</button>
      </div>
      <canvas class="laser" id="presentLaserCanvas"></canvas>
      <div style="position:absolute;right:18px;bottom:22px;color:rgba(255,255,255,.45);font-size:11px">${p.steps ? `build ${p.steps}/${builds.length}` : ""}</div>
    </div>`;
        const scene = $("#presentScene");
        for (const e of slideChildren(sl)) {
          if (hidden.has(e.id)) continue;
          const n = buildNode(e, sl.x, sl.y);
          n.style.pointerEvents = "none";
          scene.appendChild(n);
        }
        sizeLaser();
      }
      function sizeLaser() {
        const c = $("#presentLaserCanvas");
        if (!c) return;
        c.width = innerWidth * devicePixelRatio;
        c.height = innerHeight * devicePixelRatio;
        c.style.width = innerWidth + "px";
        c.style.height = innerHeight + "px";
        c.getContext("2d").setTransform(
          devicePixelRatio,
          0,
          0,
          devicePixelRatio,
          0,
          0,
        );
      }

        const pad = 40;
        const x = b.minX - pad,
          y = b.minY - pad;

      function elementSVG(e) {

          }
          case "sticky": {
            const lines = wrapText(e.text || "", e.width - 28, 16);

            lines.forEach((ln, i) => {
              s += `<text x="${e.x + 14}" y="${e.y + 26 + i * 19}" font-family="Kalam,'Comic Neue',cursive" font-size="16" fill="${th.stickyInk}">${esc(ln)}</text>`;

          }
          case "image": {
            const src = S.doc.files[e.fileId] || "";
            return `<image x="${e.x}" y="${e.y}" width="${e.width}" height="${e.height}" href="${src}" preserveAspectRatio="xMidYMid meet"/>`;
          }

                ? "7 5"
                : e.kind === "optional"
                  ? "2 5"

            if (e.kind !== "line") s += arrowHead(g, "end", th.arrow);

          default:

        const parts = [];
        parts.push(
          `<svg xmlns="http://www.w3.org/2000/svg" width="${SLIDE_W}" height="${SLIDE_H}" viewBox="${sl.x} ${sl.y} ${SLIDE_W} ${SLIDE_H}">`,
        );
        parts.push(
          `<defs><filter id="rough" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/></filter><clipPath id="clip"><rect x="${sl.x}" y="${sl.y}" width="${SLIDE_W}" height="${SLIDE_H}"/></clipPath></defs>`,
        );
        parts.push(
          `<rect x="${sl.x}" y="${sl.y}" width="${SLIDE_W}" height="${SLIDE_H}" fill="${th.slide}"/>`,
        );
        parts.push(`<g clip-path="url(#clip)">`);
        for (const e of slideChildren(sl)) parts.push(elementSVG(e));
        parts.push("</g></svg>");
        return parts.join("");

      function svgToDataURL(svg) {
        return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
      }
      function download(filename, blob) {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 1500);
      }
      function downloadSVG() {
        const o = exportState();
        if (o.scope === "slides")
          return toast("SVG export is per board — slides use PNG or PDF");
        const r = withExportTheme(() => exportSVG(o.scope, { bg: o.bg }));
        if (!r) return toast("Nothing to export yet.");
        download(
          (S.doc.name || "board").replace(/\s+/g, "-").toLowerCase() + ".svg",
          new Blob([r.svg], { type: "image/svg+xml" }),
        );
      }
      async function rasterize(svg, w, h, scale) {
        const url = svgToDataURL(svg);
        const img = new Image();
        await new Promise((res, rej) => {
          img.onload = res;
          img.onerror = rej;
          img.src = url;
        });
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(w * scale);
        canvas.height = Math.round(h * scale);
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingQuality = "high";
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        return canvas;
      }
      async function downloadPNG() {
        const o = exportState();
        if (o.scope === "slides") {
          const list = slides();
          if (!list.length) return toast("Nothing to export yet.");
          for (let i = 0; i < list.length; i++) {
            const svg = withExportTheme(() => renderSlideSVG(list[i]));
            const canvas = await rasterize(svg, SLIDE_W, SLIDE_H, o.scale);
            const blob = await new Promise((res) =>
              canvas.toBlob(res, "image/png"),
            );
            download(
              `${(S.doc.name || "deck").replace(/\s+/g, "-").toLowerCase()}-${i + 1}.png`,
              blob,
            );
            await new Promise((r) => setTimeout(r, 400));
          }
          toast(`Downloaded ${plural(list.length, "PNG")}`);
          return;
        }
        const r = withExportTheme(() => exportSVG(o.scope, { bg: o.bg }));
        if (!r) return toast("Nothing to export yet.");
        const canvas = await rasterize(r.svg, r.width, r.height, o.scale);
        const blob = await new Promise((res) =>
          canvas.toBlob(res, "image/png"),
        );
        download(
          (S.doc.name || "board").replace(/\s+/g, "-").toLowerCase() + ".png",
          blob,
        );
      }

        if (!r) return toast("Nothing to export yet.");
        const canvas = await rasterize(r.svg, r.width, r.height, o.scale);
        canvas.toBlob(async (blob) => {
          try {
            await navigator.clipboard.write([
