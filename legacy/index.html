      /* ---------- command helpers ---------- */
      function setTool(tool) {
        if (tool === "image") return pickImage();
        S.tool = tool;
        S.colorPop = false;
        renderToolbar();
        renderCanvas();
        if (S.panel === "none" && tool !== "select") S.startOpen = true;
      }
      function copySelection() {
        const list = selectionElements();
        if (!list.length) return toast("Select something first");
        S.clipboard = { elements: deep(list), files: {} };
        for (const e of list)
          if (e.type === "image" && S.doc.files[e.fileId])
            S.clipboard.files[e.fileId] = S.doc.files[e.fileId];
        toast(`${plural(list.length, "element")} copied`);
      }
      function cutSelection() {
        copySelection();
        deleteSelection();
      }
      function pasteClipboard() {
        if (!S.clipboard?.elements?.length) return toast("Nothing to paste");
        pushHistory("paste");
        const map = new Map();
        for (const e of S.clipboard.elements) map.set(e.id, uid());
        const ids = [];
        Object.assign(S.doc.files, S.clipboard.files || {});
        for (const src of S.clipboard.elements) {
          const e = deep(src);
          e.id = map.get(src.id);
          e.index = nextIndex();
          e.x += 24;
          e.y += 24;
          if (e.frameId && map.has(e.frameId)) e.frameId = map.get(e.frameId);
          if (e.type === "arrow") {
            if (e.start?.elementId && map.has(e.start.elementId))
              e.start = { ...e.start, elementId: map.get(e.start.elementId) };
            if (e.end?.elementId && map.has(e.end.elementId))
              e.end = { ...e.end, elementId: map.get(e.end.elementId) };
          }
          S.doc.elements[e.id] = e;
          ids.push(e.id);
        }
        S.selection = new Set(ids);
        renderAll();
        persist();
        toast("Pasted");
      }
      function duplicateSelection() {
        if (!S.selection.size) return toast("Select something first");
        copySelection();
        pasteClipboard();
      }
      function deleteSelection() {
        if (!S.selection.size) return;
        pushHistory("delete");
        const ids = [...S.selection];
        // deleting a slide removes its children
        for (const id of ids) {
          const e = S.doc.elements[id];
          if (e?.type === "slide")
            for (const c of slideChildren(e)) ids.push(c.id);
        }
        removeElements([...new Set(ids)]);
        S.selection.clear();
        renderAll();
        renderPanel();
        persist();
      }
      function selectAll() {
        S.selection = new Set(elements().map((e) => e.id));
        updateSelection();
        renderChrome();
      }
      function nudge(dx, dy) {
        const list = selectionElements().filter((e) => !e.locked);
        if (!list.length) return;
        const step = S._shift
          ? 1
          : settings().snapToGrid
            ? settings().gridSize
            : 1;
        pushHistory("move");
        const ids = new Set();
        for (const e of list) {
          e.x += dx * step;
          e.y += dy * step;
          if (e.type === "slide")
            for (const c of slideChildren(e)) {
              c.x += dx * step;
              c.y += dy * step;
              ids.add(c.id);
            }
        }
        renderAll();
        persist();
      }
      function editLabel() {
        if (S.selection.size !== 1) return;
        const e = selectionElements()[0];
        if (!e || e.locked) return;
        if (e.type === "diagram") {
          S.codeFor = e.id;
          S.codeDraft = e.dsl;
          setPanel("code");
          return;
        }
        if (e.type === "slide")
          return present(slides().findIndex((s) => s.id === e.id));
        if (["arrow"].includes(e.type)) {
          beginEdit(e.id);
          return;
        }
        beginEdit(e.id);
      }
      function groupSelection() {
        if (S.selection.size < 2) return toast("Select two or more elements");
        pushHistory("group");
        const gid = uid();
        for (const e of selectionElements())
          e.groupIds = [...(e.groupIds || []), gid];
        renderChrome();
        persist();
        toast("Grouped");
      }
      function ungroupSelection() {
        const gids = new Set(
          selectionElements().flatMap((e) => e.groupIds || []),
        );
        if (!gids.size) return toast("Nothing is grouped");
        pushHistory("ungroup");
        for (const e of elements())
          e.groupIds = (e.groupIds || []).filter((g) => !gids.has(g));
        renderChrome();
        persist();
        toast("Ungrouped");
      }
      function orderSelection(kind) {
        const sel = selectionElements();
        if (!sel.length) return;
        pushHistory("arrange");
        const list = sortedElements();
        const set = new Set(sel.map((e) => e.id));
        if (kind === "front") {
          for (const e of sel) list.splice(list.indexOf(e), 1);
          list.push(...sel);
        } else if (kind === "back") {
          for (const e of sel) list.splice(list.indexOf(e), 1);
          list.unshift(...sel);
        } else if (kind === "forward") {
          for (let i = list.length - 2; i >= 0; i--)
            if (set.has(list[i].id) && !set.has(list[i + 1].id))
              [list[i], list[i + 1]] = [list[i + 1], list[i]];
        } else {
          for (let i = 1; i < list.length; i++)
            if (set.has(list[i].id) && !set.has(list[i - 1].id))
              [list[i], list[i - 1]] = [list[i - 1], list[i]];
        }
        list.forEach((e, i) => {
          e.index = i + 1;
        });
        renderAll();
        persist();
      }
      function toggleLock() {
        const list = selectionElements();
        if (!list.length) return;
        const lock = !list.every((e) => e.locked);
        pushHistory("lock");
        list.forEach((e) => {
          e.locked = lock;
        });
        renderAll();
        renderChrome();
        persist();
        toast(lock ? "Locked" : "Unlocked");
      }
      function toggleSnap() {
        S.doc.settings.snapToGrid = !S.doc.settings.snapToGrid;
        renderChrome();
        persist();
        toast(S.doc.settings.snapToGrid ? "Snap to dots on" : "Snap off");
      }
      function toggleGrid() {
        S.doc.settings.showGrid = !S.doc.settings.showGrid;
        renderAll();
        persist();
      }
      function toggleZen() {
        S.zen = !S.zen;
        renderAll();
        renderChrome();
      }
      function cleanIt() {
        const diagrams = S.selection.size
          ? selectionElements().filter((e) => e.type === "diagram")
          : elements().filter((e) => e.type === "diagram");
        if (!diagrams.length) return toast("Add a diagram first");
        pushHistory("clean it");
        let n = 0;
        for (const d of diagrams) {
          const parsed = parseDSL(d.dsl);
          if (parsed.diagnostics.some((x) => x.severity === "error")) continue;
          const layout = layoutDiagram(parsed);
          d.width = layout.width;
          d.height = layout.height;
          n++;
        }
        renderAll();
        persist();
        toast(
          n ? `Cleaned up ${plural(n, "diagram")}` : "Fix diagram errors first",
        );
      }
      function toggleTheme() {
        S.themePref = S.themePref === "dark" ? "light" : "dark";
        renderAll();
        renderChrome();
        persist();
      }

      /* ============================================================
   Actions
   ============================================================ */
      function runAct(act, ds, el) {
        /* the main menu / shortcuts sheet can launch any surface; close it first so the
     panel or dialog is not buried under an overlay. */
        if (
          S.help ||
          S.shortcuts ||
          S.exportOpen ||
          S.connectOpen ||
          S.iconSearch ||
          S.renameOpen ||
          S.mermaidOpen
        ) {
          if (
            [
              "assistant",
              "slides",
              "boards",
              "code",
              "sot",
              "export",
              "menu",
              "shortcuts",
              "connect",
              "mermaid",
              "iconSearch",
            ].includes(act)
          )
            closeOverlays();
        }
        switch (act) {
          case "noop":
            return;
          case "tool":
            return setTool(ds.tool);
          case "panel":
            return setPanel(ds.panel);
          case "closePanel":
            return setPanel(S.panel);
          case "assistant":
            return setPanel("assistant");
          case "slides":
            return setPanel("slides");
          case "boards":
            return setPanel("boards");
          case "code":
            return setPanel("code");
          case "menu":
            S.help = true;
            return renderOverlays();
          case "shortcuts":
            S.shortcuts = true;
            return renderOverlays();
          case "closeOverlay":
            return closeOverlays();
          case "overlayBg":
            return; // handled by click listener
          case "style":
            settings().style = ds.style;
            S.startOpen = true;
            renderAll();
            renderChrome();
            persist();
            return;
          case "font": {
            settings().handFont =
              settings().handFont === "kalam" ? "excalifont" : "kalam";
            renderAll();
            persist();
            return toast(
              settings().handFont === "kalam" ? "Kalam" : "Excalifont",
            );
          }
          case "bw":
            settings().palette = paletteOn() ? "mono" : "roles";
            renderAll();
            renderChrome();
            persist();
            return;
          case "theme":
            return toggleTheme();
          case "rename":
            S.renameOpen = true;
            renderOverlays();
            requestAnimationFrame(() => {
              const i = $("#renameInput");
              i && i.select();
            });
            return;
          case "saveRename": {
            const v = $("#renameInput")?.value?.trim();
            if (v) {
              S.doc.name = v;
              persist(true);
            }
            S.renameOpen = false;
            renderOverlays();
            renderChrome();
            return;
          }
          case "share": {
            saveBoardCopy();
            const link =
              location.origin + location.pathname + "#/b/" + S.doc.id;
            navigator.clipboard
              ?.writeText(link)
              .then(() => toast("Board link copied"))
              .catch(() => toast(link));
            return;
          }
          case "export":
            S.exportOpen = true;
            renderOverlays();
            return;
          case "expScope":
            S.exportOpts = {
              ...exportState(),
              scope: ds.scope,
              format:
                ds.scope === "slides"
                  ? "pdf"
                  : exportState().format === "svg"
                    ? "svg"
                    : "png",
            };
            return renderOverlays();
          case "expFormat":
            S.exportOpts = { ...exportState(), format: ds.format };
            return renderOverlays();
          case "expScale":
            S.exportOpts = { ...exportState(), scale: Number(ds.scale) };
            return renderOverlays();
          case "expBg":
            S.exportOpts = { ...exportState(), bg: el.checked };
            return renderOverlays();
          case "expDark":
            S.exportOpts = { ...exportState(), dark: el.checked };
            return renderOverlays();
          case "doExport": {
            const o = exportState();
            if (o.scope === "slides") {
              if (o.format === "pdf") printDeck();
              else downloadPNG();
            } else if (o.format === "svg") downloadSVG();
            else downloadPNG();
            return;
          }
          case "copyExport":
            copyExport();
            return;
          case "zoomout":
            return zoomAt(innerWidth / 2, innerHeight / 2, 1 / 1.2);
          case "zoomin":
            return zoomAt(innerWidth / 2, innerHeight / 2, 1.2);
          case "zoomreset":
            return setZoom(1);
          case "fit":
            return fitAll();
          case "snap":
            return toggleSnap();
          case "dots":
            return toggleGrid();
          case "undo":
            return undo();
          case "redo":
            return redo();
          case "autocolor": {
            pushHistory("auto color");
            selectionElements().forEach((e) => {
              e.colorLocked = false;
              e.color = null;
            });
            renderAll();
            return;
          }
          case "colorpop":
            S.colorPop = !S.colorPop;
            return renderChrome();
          case "color": {
            pushHistory("color");
            selectionElements().forEach((e) => {
              e.color = ds.color;
              e.colorLocked = true;
            });
            renderAll();
            return;
          }
          case "nofill": {
            pushHistory("fill");
            const shapes = selectionElements().filter(
              (e) => e.type === "shape",
            );
            const all = shapes.every((e) => e.noFill);
            shapes.forEach((e) => {
              e.noFill = !all;
            });
            renderAll();
            return;
          }
          case "shape": {
            pushHistory("shape");
            selectionElements()
              .filter((e) => e.type === "shape")
              .forEach((e) => {
                e.shape = ds.shape;
              });
            renderAll();
            return;
          }
          case "route": {
            pushHistory("route");
            selectionElements()
              .filter((e) => e.type === "arrow")
              .forEach((e) => {
                e.routeMode = ds.route;
              });
            renderAll();
            return;
          }
          case "textinc":
          case "textdec": {
            const d = act === "textinc" ? 2 : -2;
            pushHistory("text size");
            selectionElements().forEach((e) => {
              if (e.type === "text") e.fontSize = clamp(e.fontSize + d, 8, 160);
            });
            renderAll();
            return;
          }
          case "z":
            return orderSelection(ds.z);
          case "duplicate":
            return duplicateSelection();
          case "delete":
            return deleteSelection();
          case "lock":
            return toggleLock();
          case "layoutPicker":
            S.layoutPicker = !S.layoutPicker;
            return renderPanel();
          case "addSlide":
            S.layoutPicker = false;
            addSlide(ds.layout);
            return;
          case "selectionSlide":
            return selectionToSlide();
          case "arrangeSlides":
            return arrangeSlides();
          case "duplicateSlide":
            return duplicateSlide(ds.id);
          case "deleteSlide":
            return deleteSlide(ds.id);
          case "present":
            return present(Number(ds.index || 0));
          case "presentFromThumb":
            if (ds.index != null) present(Number(ds.index));
            return;
          case "presentPrev":
            return presentNav(-1);
          case "presentNext":
            return presentNav(1);
          case "presentExit":
            return exitPresent();
          case "presentLaser":
            if (S.present) {
              S.present.laser = !S.present.laser;
              renderPresent();
            }
            return;
          case "applyCode":
            return applyCode();
          case "validateCode":
            return validateCode();
          case "exampleCode":
            S.codeDraft = TEMPLATES.demo;
            return renderPanel();
          case "connect":
            S.connectOpen = true;
            renderOverlays();
            return;
          case "pickProvider":
            S.connectProvider = ds.id;
            S.connectModel = AI_META[ds.id].model;
            return renderOverlays();
          case "saveKey": {
            const cfg = aiConfig();
            const provider = S.connectProvider || cfg.provider || "anthropic";
            const key = $('[data-role="aiKey"]')?.value?.trim() || "";
            const model =
              $('[data-role="aiModel"]')?.value?.trim() ||
              AI_META[provider].model;
            const baseUrl =
              $('[data-role="aiBase"]')?.value?.trim() || cfg.baseUrl || "";
            if (!key) return toast("Paste an API key first");
            cfg.provider = provider;
            cfg.model = model;
            cfg.baseUrl = baseUrl;
            cfg.keys = { ...(cfg.keys || {}), [provider]: key };
            aiSave(cfg);
            S.connectOpen = false;
            S.connectProvider = null;
            S.connectModel = null;
            renderOverlays();
            if (S.panel === "assistant") renderPanel();
            toast("AI connected");
            return;
          }
          case "forgetKey": {
            const cfg = aiConfig();
            const provider = cfg.provider || "anthropic";
            if (cfg.keys) delete cfg.keys[provider];
            aiSave(cfg);
            renderPanel();
            return toast("Key forgotten");
          }
          case "sendAI": {
            const i = $("#askInput");
            const v = i?.value || "";
            if (i) i.value = "";
            sendAI(v);
            return;
          }
          case "suggest":
            return sendAI(ds.text || "");
          case "stopAI":
            S.assistant.abort?.abort();
            return;
          case "insertIcon": {
            pushHistory("add icon");
            const c = viewportCenter();
            const label = ds.icon
              .split("-")
              .map((s) => s[0].toUpperCase() + s.slice(1))
              .join(" ");
            const el2 = MAKE.shape({
              x: Math.round(c.x - 80),
              y: Math.round(c.y - 32),
              width: 170,
              height: 64,
              icon: ds.icon,
              label,
              shape: "rounded",
            });
            addElement(el2);
            S.selection = new Set([el2.id]);
            S.iconSearch = false;
            renderOverlays();
            renderAll();
            persist();
            return;
          }
          case "boardNew":
            return newBoard();
          case "boardOpen":
            return openBoard(ds.id);
          case "boardDelete": {
            if (!confirm("Delete this board? This cannot be undone.")) return;
            const list = boardsList().filter((b) => b.id !== ds.id);
            localStorage.setItem(KEY_BOARDS, JSON.stringify(list));
            localStorage.removeItem("jojopen.board." + ds.id);
            if (ds.id === S.doc.id) {
              newBoard();
            }
            renderPanel();
            return;
          }
          case "importJson":
            return importJSON();
          case "downloadJson":
            return downloadJSON();
          case "template":
            return applyTemplate(ds.id);
          case "blank":
            S.startOpen = true;
            renderStart();
            renderChrome();
            return;
          case "replay":
            return openReplay();
          case "replayPrev":
            return replayStep(-1);
          case "replayNext":
            return replayStep(1);
          case "replayPlay":
            return replayToggle();
          case "replayClose":
            return closeReplay();
          case "replayScrub":
            return;
          case "sot":
            return sotToggle();
          case "sotNew":
            return sotStart();
          case "sotClose":
            if (S.sot.replay) return sotCloseReplay();
            S.sot.listOpen = false;
            renderSotCard();
            renderChrome();
            return;
          case "sotPlay":
            return sotOpenReplay(ds.id);
          case "sotDel":
            return sotDelete(ds.id);
          case "sotPrev":
            return sotSetIndex((S.sot.replay?.index || 0) - 1);
          case "sotNext":
            return sotSetIndex((S.sot.replay?.index || 0) + 1);
          case "sotPlayPause":
            return sotPlayToggle();
          case "sotSpeed":
            return sotCycleSpeed();
          case "sotExportToggle":
            if (S.sot.replay) {
              S.sot.replay.exportOpen = !S.sot.replay.exportOpen;
              renderSotReplay();
            }
            return;
          case "sotExport":
            return sotExport(ds.kind);
          case "toggleBuilds":
            return;
          case "buildAppear":
            return buildAdd(ds.slide, "appear");
          case "buildHighlight":
            return buildAdd(ds.slide, "highlight");
          case "buildReplay":
            return buildReplay(ds.slide);
          case "mermaid":
            return mermaidOpen();
          case "mermaidConvert":
            return mermaidConvert();
          case "newDiagram":
            return newDiagram();
          case "runCmd": {
            const c = COMMANDS.find((x) => x.id === ds.cmd);
            closeOverlays();
            c?.run?.();
            return;
          }
          case "clean":
            cleanIt();
            return;
          case "exportDone":
            return;
          default:
            return;
        }
      }

      /* ---------- boards ---------- */
      function newBoard() {
        saveBoardCopy();
        S.doc = blankDoc("Untitled board");
        S.selection.clear();
        S.history = [];
        S.future = [];
        S.timeline = [];
        S.camera = { x: 80, y: 80, zoom: 1 };
        S.startOpen = false;
        history.replaceState(null, "", location.pathname);
        renderAll();
        renderPanel();
        persist(true);
        toast("New board");
      }
      function downloadJSON() {
        const data = {
          app: "JojoPen",
          exportedAt: new Date().toISOString(),
          doc: S.doc,
        };
        download(
          (S.doc.name || "board").replace(/\s+/g, "-").toLowerCase() +
            ".jojopen.json",
          new Blob([JSON.stringify(data, null, 2)], {
            type: "application/json",
          }),
        );
      }
      function importJSON() {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "application/json,.json";
        input.onchange = async () => {
          const f = input.files?.[0];
          if (!f) return;
          try {
            const j = JSON.parse(await f.text());
            const doc = j.doc || j;
            if (!doc.elements) throw new Error("Not a JojoPen file");
            saveBoardCopy();
            S.doc = normalizeDoc({
              ...doc,
              id: uid(),
              name: doc.name || f.name.replace(/\.json$/, ""),
            });
            S.selection.clear();
            S.history = [];
            S.future = [];
            S.timeline = [];
            S.camera = { x: 0, y: 0, zoom: 1 };
            renderAll();
            persist(true);
            fitAll();
            toast("Imported " + S.doc.name);
          } catch (e) {
            toast("Could not read that file");
          }
        };
        input.click();
      }
      function applyTemplate(id) {
        S.startOpen = true;
        if (id === "system" || id === "flow") {
          pushHistory("template");
          const dsl = id === "system" ? TEMPLATES.system : TEMPLATES.flow;
          const parsed = parseDSL(dsl);
          const layout = layoutDiagram(parsed);
          const el2 = MAKE.diagram({
            x: 0,
            y: 0,
            width: layout.width,
            height: layout.height,
            title:
              parsed.title ||
              (id === "system" ? "URL shortener" : "Sign-up flow"),
            dsl,
          });
          addElement(el2);
          S.doc.name = id === "system" ? "URL shortener" : "Sign-up flow";
          S.selection = new Set([el2.id]);
          renderAll();
          persist(true);
          fitAll();
          return toast("Added " + el2.title);
        }
        if (id === "deck") {
          S.doc.name = "Slide deck";
          addSlide("title", {
            title: "Your talk title",
            texts: ["Your talk title", "A short subtitle"],
          });
          addSlide("bullets", {
            title: "Agenda",
            texts: [
              "Agenda",
              "•  The problem\n•  How it works\n•  What we learned",
            ],
          });
          addSlide("diagram-bullets", {
            title: "How it works",
            texts: [
              "How it works",
              "•  Reads hit the cache first\n•  Misses fall back to the database",
            ],
            diagram: TEMPLATES.slideDiagram,
          });
          setPanel("slides");
          renderAll();
          persist(true);
          setTimeout(() => fitAll(), 30);
          return;
        }
      }

      /* ---------- replay (Sands of Time) ---------- */
      function openReplay() {
        const entries = S.timeline.slice(-90).map((e) => ({ ...e }));
        if (!entries.length) return toast("Draw something first");
        entries.push({ json: snapshot(), label: "Now", at: Date.now() });
        S.replay = {
          list: entries,
          index: entries.length - 1,
          playing: false,
          timer: null,
        };
        renderReplay();
      }
      function closeReplay() {
        if (S.replay?.timer) clearInterval(S.replay.timer);
        S.replay = null;
        $("#overlayRoot").style.zIndex = "";
        const host = $("#replayRoot");
        host && host.remove();
        renderChrome();
      }
      function replayStep(d) {
        if (!S.replay) return;
        S.replay.index = clamp(S.replay.index + d, 0, S.replay.list.length - 1);
        renderReplay();
      }
      function replayToggle() {
        if (!S.replay) return;
        const r = S.replay;
        if (r.playing) {
          clearInterval(r.timer);
          r.playing = false;
          r.timer = null;
        } else {
          if (r.index >= r.list.length - 1) r.index = 0;
          r.playing = true;
          r.timer = setInterval(() => {
            if (!S.replay) return;
            if (S.replay.index >= S.replay.list.length - 1) {
              replayToggle();
              renderReplay();
              return;
            }
            S.replay.index++;
            renderReplay();
          }, 650);
        }
        renderReplay();
      }
      function renderReplay() {
        if (!S.replay) return;
        let host = $("#replayRoot");
        if (!host) {
          host = document.createElement("div");
          host.id = "replayRoot";
          document.body.appendChild(host);
        }
        const r = S.replay;
        const entry = r.list[r.index];
        let sceneHTML = "",
          sw = 900,
          sh = 600;
        const cur = S.doc;
        try {
          S.doc = normalizeDoc({ ...JSON.parse(entry.json), id: cur.id });
          const list = [...elements()];
          const b = boundsOf(list) || {
            minX: 0,
            minY: 0,
            width: 900,
            height: 600,
          };
          sw = Math.max(320, b.width);
          sh = Math.max(200, b.height);
          const holder = document.createElement("div");
          for (const e of sortedElements())
            holder.appendChild(buildNode(e, b.minX - 40, b.minY - 40));
          sceneHTML = holder.innerHTML;
          S.doc = cur;
        } catch (e) {
          S.doc = cur;
        }
        const vw = innerWidth,
          vh = innerHeight;
        const scale = Math.min(
          (vw - 140) / (sw + 80),
          (vh - 240) / (sh + 80),
          1.4,
        );
        host.innerHTML = `<div class="replay" role="dialog" aria-label="Sands of Time replay">
    <div class="replay-bar" style="margin-bottom:2px">
      <span style="font-size:12px;opacity:.8">Sands of Time</span>
      <span class="replay-label">${esc(entry.label || "Edit")}</span>
    </div>
    <div class="scene-wrap" style="width:${(sw + 80) * scale}px;height:${(sh + 80) * scale}px;background:${theme().board}">
      <div class="scene" style="width:${sw + 80}px;height:${sh + 80}px;background:${theme().board};transform:scale(${scale});transform-origin:0 0">${sceneHTML}</div>
    </div>
    <div class="replay-bar">
      <button data-act="replayPrev" title="Previous step">${ico("prev", 16)}</button>
      <button data-act="replayPlay" title="Play">${ico(r.playing ? "pause" : "play", 16)}</button>
      <button data-act="replayNext" title="Next step">${ico("next", 16)}</button>
      <div class="replay-track" id="replayTrack"><i style="width:${((r.index + 1) / r.list.length) * 100}%"></i></div>
      <span class="replay-label">${r.index + 1} / ${r.list.length}</span>
      <button data-act="replayClose" title="Close">${ico("close", 16)}</button>
    </div>
  </div>`;
        const track = $("#replayTrack");
        if (track)
          track.addEventListener("click", (e) => {
            if (!S.replay) return;
            const rc = track.getBoundingClientRect();
            const ratio = clamp((e.clientX - rc.left) / rc.width, 0, 1);
            S.replay.index = Math.round(ratio * (S.replay.list.length - 1));
            renderReplay();
          });
      }

      /* ============================================================
   Text editing
   ============================================================ */
      function beginEdit(id) {
        const el2 = S.doc.elements[id];
        if (!el2 || el2.locked) return;
        const b = elementBounds(el2);
        const z = S.camera.zoom;
        const ta = document.createElement("textarea");
        ta.className = "texteditor";
        const isText = el2.type === "text";
        const fs = isText ? el2.fontSize : el2.type === "sticky" ? 16 : 14;
        ta.style.left = b.minX * z + S.camera.x + "px";
        ta.style.top = b.minY * z + S.camera.y + "px";
        ta.style.width = Math.max(60, b.width * z) + "px";
        ta.style.height = Math.max(28, b.height * z) + "px";
        ta.style.fontSize = fs * z + "px";
        ta.style.lineHeight = 1.28;
        ta.style.fontFamily =
          isText || el2.type === "sticky" ? fontFor(el2) : "var(--sans)";
        ta.style.textAlign = isText
          ? el2.align || "left"
          : el2.type === "shape"
            ? "center"
            : "left";
        ta.style.padding =
          el2.type === "sticky" ? `${14 * z}px` : isText ? "0" : "6px 10px";
        if (el2.type === "sticky") ta.style.background = "#fff3b8";
        ta.value =
          el2.type === "arrow"
            ? el2.label || ""
            : (el2.text ?? el2.label ?? "");
        document.body.appendChild(ta);
        S.editingId = id;
        ta.focus();
        ta.select();
        let done = false;
        const finish = (cancel) => {
          if (done) return;
          done = true;
          const v = ta.value;
          ta.remove();
          S.editingId = null;
          if (cancel) {
            renderAll();
            return;
          }
          pushHistory("edit text");
          if (el2.type === "arrow") el2.label = v.trim();
          else if (el2.type === "text") {
            if (v.trim()) el2.text = v;
            else removeElements([id]);
          } else el2.label = v;
          renderAll();
          persist();
        };
        ta.addEventListener("blur", () => finish(false));
        ta.addEventListener("keydown", (e) => {
          e.stopPropagation();
          if (e.key === "Escape") {
            e.preventDefault();
            finish(true);
          }
          if (e.key === "Enter" && !e.shiftKey && el2.type !== "text") {
            e.preventDefault();
            finish(false);
          }
          if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
            e.preventDefault();
            finish(false);
          }
        });
      }

      /* ============================================================
   Pointer interactions
   ============================================================ */
      const canvas = () => $("#canvas");
      function onPointerDown(e) {
        if (e.button === 2) return;
        if (S.present || S.replay || S.sot.replay) return;
        if (S.editingId) return;
        const target = e.target;
        const nodeEl = target.closest?.(".node");
        const edgeEl = target.closest?.(".edges [data-id]");
        if (S.space || S.tool === "hand" || e.button === 1) {
          startPan(e);
          return;
        }
        if (S.tool === "eraser") {
          startErase(e);
          return;
        }
        if (S.tool === "laser") {
          laserAdd(e.clientX, e.clientY);
          return;
        }
        if (nodeEl) return onNodeDown(e, nodeEl);
        if (edgeEl) return onEdgeDown(e, edgeEl);
        // background
        const w = toWorld(e.clientX, e.clientY);
        if (S.tool === "select") {
          startMarquee(e);
          return;
        }
        if (
          S.tool === "rectangle" ||
          S.tool === "ellipse" ||
          S.tool === "diamond" ||
          S.tool === "cylinder" ||
          S.tool === "frame"
        )
          return startCreate(e, w);
        if (S.tool === "arrow" || S.tool === "line") return startArrow(e, w);
        if (S.tool === "pen") return startPen(e, w);
        if (S.tool === "text") return createTextAt(w);
        if (S.tool === "sticky") return createStickyAt(w);
        startMarquee(e);
      }
      function onNodeDown(e, nodeEl) {
        const el2 = S.doc.elements[nodeEl.dataset.id];
        if (!el2) return;
        e.stopPropagation();
        if (S.tool === "eraser") return startErase(e);
        if (S.tool === "arrow" || S.tool === "line") {
          const w = toWorld(e.clientX, e.clientY);
          return startArrow(e, w, el2);
        }
        if (S.tool !== "select") {
          setTool("select");
        }
        const groupIds = el2.groupIds || [];
        let ids = [el2.id];
        if (groupIds.length)
          ids = elements()
            .filter((x) => x.groupIds?.some((g) => groupIds.includes(g)))
            .map((x) => x.id);
        if (e.shiftKey) {
          if (S.selection.has(el2.id))
            ids.forEach((i) => S.selection.delete(i));
          else ids.forEach((i) => S.selection.add(i));
        } else if (!S.selection.has(el2.id)) {
          S.selection = new Set(ids);
        }
        updateSelection();
        renderChrome();
        if (!el2.locked) startMove(e);
      }
      function onEdgeDown(e, edgeEl) {
        const el2 = S.doc.elements[edgeEl.dataset.id];
        if (!el2) return;
        e.stopPropagation();
        if (S.tool === "eraser") {
          startErase(e);
          return;
        }
        if (S.tool !== "select") setTool("select");
        if (e.shiftKey) {
          if (S.selection.has(el2.id)) S.selection.delete(el2.id);
          else S.selection.add(el2.id);
        } else S.selection = new Set([el2.id]);
        updateSelection();
        renderChrome();
        if (!el2.locked) startMove(e);
      }
      function startPan(e) {
        S.drag = {
          mode: "pan",
          start: { x: e.clientX, y: e.clientY },
          cam: { ...S.camera },
        };
        S.panning = true;
        canvas().classList.add("panning");
        pcap(canvas(), e.pointerId);
      }
      function startMove(e) {
        const list = selectionElements().filter((x) => !x.locked);
        if (!list.length) return;
        const positions = new Map();
        for (const el2 of list) {
          positions.set(el2.id, { x: el2.x, y: el2.y });
          if (el2.type === "slide")
            for (const c of slideChildren(el2))
              if (!positions.has(c.id)) positions.set(c.id, { x: c.x, y: c.y });
        }
        pushHistory("move");
        S.drag = {
          mode: "move",
          start: { x: e.clientX, y: e.clientY },
          positions,
          moved: false,
        };
        pcap(canvas(), e.pointerId);
      }
      function startMarquee(e) {
        const r = canvas().getBoundingClientRect();
        if (!e.shiftKey) S.selection.clear();
        S.marquee = {
          x0: e.clientX - r.left,
          y0: e.clientY - r.top,
          x1: e.clientX - r.left,
          y1: e.clientY - r.top,
          additive: e.shiftKey,
        };
        updateSelection();
        renderChrome();
        pcap(canvas(), e.pointerId);
      }
      function startCreate(e, w) {
        pushHistory("add " + S.tool);
        const kind = S.tool;
        const shape = kind === "frame" ? null : kind;
        const el2 = shape
          ? MAKE.shape({
              x: w.x,
              y: w.y,
              width: 1,
              height: 1,
              shape,
              label: "",
            })
          : MAKE.container({
              x: w.x,
              y: w.y,
              width: 1,
              height: 1,
              label: "Group",
            });
        addElement(el2);
        S.selection = new Set([el2.id]);
        S.drag = { mode: "create", id: el2.id, start: w, toolKind: kind };
        pcap(canvas(), e.pointerId);
      }
      function createTextAt(w) {
        pushHistory("add text");
        const el2 = MAKE.text({
          x: Math.round(w.x),
          y: Math.round(w.y - 14),
          width: 260,
          height: 32,
          text: "",
          fontSize: 22,
          align: "left",
        });
        addElement(el2);
        S.selection = new Set([el2.id]);
        renderAll();
        beginEdit(el2.id);
        setTool("select");
      }
      function createStickyAt(w) {
        pushHistory("add sticky");
        const el2 = MAKE.sticky({
          x: Math.round(w.x - 100),
          y: Math.round(w.y - 100),
          width: 200,
          height: 200,
          text: "",
        });
        addElement(el2);
        S.selection = new Set([el2.id]);
        renderAll();
        beginEdit(el2.id);
        setTool("select");
      }
      function startArrow(e, w, startEl = null) {
        pushHistory("add arrow");
        const el2 = MAKE.arrow({
          x: 0,
          y: 0,
          points: [
            { x: w.x, y: w.y },
            { x: w.x, y: w.y },
          ],
          kind: S.tool === "line" ? "line" : "sync",
          routeMode: S.tool === "line" ? "straight" : "orthogonal",
          startHead: "none",
          endHead: S.tool === "line" ? "none" : "triangle",
        });
        if (startEl) el2.start = { elementId: startEl.id, anchor: "auto" };
        addElement(el2);
        S.selection = new Set([el2.id]);
        S.drag = { mode: "arrow", id: el2.id, startEl: startEl?.id || null };
        pcap(canvas(), e.pointerId);
        renderAll();
      }
      function startPen(e, w) {
        pushHistory("draw");
        const el2 = MAKE.freehand({
          x: w.x,
          y: w.y,
          points: [{ x: 0, y: 0 }],
          strokeWidth: 2,
        });
        addElement(el2);
        S.selection = new Set([el2.id]);
        S.drag = { mode: "pen", id: el2.id };
        pcap(canvas(), e.pointerId);
      }
      function startErase(e) {
        pushHistory("erase");
        S.drag = { mode: "erase" };
        eraseAt(e.clientX, e.clientY);
        pcap(canvas(), e.pointerId);
      }
      function eraseAt(cx, cy) {
        const w = toWorld(cx, cy);
        const hit = sortedElements()
          .reverse()
          .find(
            (x) =>
              x.type !== "arrow" &&
              x.type !== "freehand" &&
              !x.locked &&
              pointInElement(w.x, w.y, x),
          );
        if (hit) {
          removeElements([hit.id]);
          S.selection.delete(hit.id);
          scheduleRender();
        }
      }
      function onPointerMove(e) {
        if (S.replay) return;
        if (S.present) return;
        if (S.tool === "laser" && !S.drag) {
          laserAdd(e.clientX, e.clientY);
          return;
        }
        if (S.drag) {
          const d = S.drag,
            z = S.camera.zoom;
          if (d.mode === "pan") {
            S.camera.x = d.cam.x + (e.clientX - d.start.x);
            S.camera.y = d.cam.y + (e.clientY - d.start.y);
            scheduleRender();
            return;
          }
          if (d.mode === "move") {
            let dx = (e.clientX - d.start.x) / z,
              dy = (e.clientY - d.start.y) / z;
            const g = settings();
            if (g.snapToGrid && !e.altKey) {
              dx = Math.round(dx / g.gridSize) * g.gridSize;
              dy = Math.round(dy / g.gridSize) * g.gridSize;
            }
            d.moved = Math.abs(dx) + Math.abs(dy) > 0;
            for (const [id, pos] of d.positions) {
              const el2 = S.doc.elements[id];
              if (!el2) continue;
              if (
                el2.type === "arrow" &&
                (el2.start?.elementId || el2.end?.elementId)
              )
                continue;
              el2.x = pos.x + dx;
              el2.y = pos.y + dy;
            }
            scheduleRender();
            updateSelection();
            return;
          }
          if (d.mode === "resize") {
            const el2 = S.doc.elements[d.id];
            if (!el2) return;
            let dx = (e.clientX - d.start.x) / z,
              dy = (e.clientY - d.start.y) / z;
            const g = settings();
            if (g.snapToGrid && !e.altKey) {
              dx = Math.round(dx / g.gridSize) * g.gridSize;
              dy = Math.round(dy / g.gridSize) * g.gridSize;
            }
            const r = d.rect,
              h = d.handle;
            let x = r.x,
              y = r.y,
              w = r.w,
              ht = r.h;
            if (h.includes("e")) w = r.w + dx;
            if (h.includes("s")) ht = r.h + dy;
            if (h.includes("w")) {
              x = r.x + dx;
              w = r.w - dx;
            }
            if (h.includes("n")) {
              y = r.y + dy;
              ht = r.h - dy;
            }
            if (w < 16) {
              w = 16;
              x = r.x + r.w - 16;
            }
            if (ht < 16) {
              ht = 16;
              y = r.y + r.h - 16;
            }
            el2.x = x;
            el2.y = y;
            el2.width = w;
            el2.height = ht;
            scheduleRender();
            updateSelection();
            return;
          }
          if (d.mode === "create") {
            const el2 = S.doc.elements[d.id];
            if (!el2) return;
            const w = toWorld(e.clientX, e.clientY);
            let x = Math.min(d.start.x, w.x),
              y = Math.min(d.start.y, w.y);
            let ww = Math.abs(w.x - d.start.x),
              hh = Math.abs(w.y - d.start.y);
            const g = settings();
            if (g.snapToGrid && !e.altKey) {
              x = Math.round(x / g.gridSize) * g.gridSize;
              y = Math.round(y / g.gridSize) * g.gridSize;
              ww = Math.round(ww / g.gridSize) * g.gridSize;
              hh = Math.round(hh / g.gridSize) * g.gridSize;
            }
            el2.x = x;
            el2.y = y;
            el2.width = Math.max(1, ww);
            el2.height = Math.max(1, hh);
            scheduleRender();
            updateSelection();
            return;
          }
          if (d.mode === "arrow") {
            const el2 = S.doc.elements[d.id];
            if (!el2) return;
            const w = toWorld(e.clientX, e.clientY);
            el2.points[el2.points.length - 1] = { x: w.x, y: w.y };
            d.endWorld = w;
            scheduleRender();
            return;
          }
          if (d.mode === "pen") {
            const el2 = S.doc.elements[d.id];
            if (!el2) return;
            const w = toWorld(e.clientX, e.clientY);
            const last = el2.points[el2.points.length - 1];
            if (Math.hypot(w.x - el2.x - last.x, w.y - el2.y - last.y) > 1.2) {
              el2.points.push({ x: w.x - el2.x, y: w.y - el2.y });
            }
            scheduleRender();
            return;
          }
          if (d.mode === "erase") {
            eraseAt(e.clientX, e.clientY);
            return;
          }
        }
        if (S.marquee) {
          const r = canvas().getBoundingClientRect();
          S.marquee.x1 = e.clientX - r.left;
          S.marquee.y1 = e.clientY - r.top;
          const m = S.marquee;
          const box = $("#marquee");
          box.classList.add("on");
          box.style.left = Math.min(m.x0, m.x1) + "px";
          box.style.top = Math.min(m.y0, m.y1) + "px";
          box.style.width = Math.abs(m.x1 - m.x0) + "px";
          box.style.height = Math.abs(m.y1 - m.y0) + "px";
        }
      }
      function onPointerUp(e) {
        if (S.present || S.replay) return;
        const d = S.drag;
        if (S.marquee) finishMarquee();
        if (!d) {
          S.panning = false;
          canvas()?.classList.remove("panning");
          return;
        }
        if (d.mode === "create") {
          const el2 = S.doc.elements[d.id];
          if (el2) {
            if (el2.width < 8 && el2.height < 8) {
              if (d.toolKind === "frame") {
                el2.width = 400;
                el2.height = 240;
                el2.x -= 200;
                el2.y -= 120;
              } else {
                el2.width = 160;
                el2.height = 64;
                el2.x -= 80;
                el2.y -= 32;
              }
              if (!el2.label) el2.label = d.toolKind === "frame" ? "Group" : "";
            }
            el2.width = Math.max(16, el2.width);
            el2.height = Math.max(16, el2.height);
            S.selection = new Set([el2.id]);
          }
          setTool("select");
        } else if (d.mode === "arrow") {
          const el2 = S.doc.elements[d.id];
          if (el2) {
            const p0 = el2.points[0],
              p1 = el2.points[el2.points.length - 1];
            if (Math.hypot(p1.x - p0.x, p1.y - p0.y) < 8) {
              removeElements([el2.id]);
              S.selection.clear();
            } else {
              if (!el2.start) {
                const hit = nextFrameElement({ x: p0.x, y: p0.y }, el2.id);
                if (hit) el2.start = { elementId: hit.id, anchor: "auto" };
              }
              const hit2 = nextFrameElement({ x: p1.x, y: p1.y }, el2.id);
              if (hit2) el2.end = { elementId: hit2.id, anchor: "auto" };
              S.selection = new Set([el2.id]);
            }
          }
          setTool("select");
        } else if (d.mode === "pen") {
          const el2 = S.doc.elements[d.id];
          if (el2) {
            el2.points = el2.points.filter((p, i) => {
              const prev = el2.points[i - 1];
              return !prev || Math.hypot(p.x - prev.x, p.y - prev.y) > 0.9;
            });
            const pts = el2.points.map((p) => ({
              x: el2.x + p.x,
              y: el2.y + p.y,
            }));
            const xs = pts.map((p) => p.x),
              ys = pts.map((p) => p.y);
            el2.width = Math.max(...xs) - Math.min(...xs);
            el2.height = Math.max(...ys) - Math.min(...ys);
          }
          setTool("select");
        }
        S.drag = null;
        S.panning = false;
        canvas()?.classList.remove("panning");
        renderAll();
        persist();
      }
      function finishMarquee() {
        const m = S.marquee;
        S.marquee = null;
        $("#marquee")?.classList.remove("on");
        if (!m) return;
        if (Math.abs(m.x1 - m.x0) < 3 && Math.abs(m.y1 - m.y0) < 3) {
          clearSelection();
          return;
        }
        const r = canvas().getBoundingClientRect();
        const a = toWorld(
          r.left + Math.min(m.x0, m.x1),
          r.top + Math.min(m.y0, m.y1),
        );
        const b = toWorld(
          r.left + Math.max(m.x0, m.x1),
          r.top + Math.max(m.y0, m.y1),
        );
        if (!m.additive) S.selection.clear();
        for (const el2 of elements()) {
          const bb = elementBounds(el2);
          if (
            bb.maxX >= a.x &&
            bb.minX <= b.x &&
            bb.maxY >= a.y &&
            bb.minY <= b.y
          )
            S.selection.add(el2.id);
        }
        updateSelection();
        renderChrome();
      }
      function onDblClick(e) {
        const nodeEl = e.target.closest?.(".node");
        if (!nodeEl) return;
        const el2 = S.doc.elements[nodeEl.dataset.id];
        if (!el2) return;
        if (el2.type === "diagram") {
          S.codeFor = el2.id;
          S.codeDraft = el2.dsl;
          setPanel("code");
          return;
        }
        if (el2.type === "slide") {
          present(slides().findIndex((s) => s.id === el2.id));
          return;
        }
        if (el2.type === "image") return;
        beginEdit(el2.id);
      }
      function onWheel(e) {
        if (S.present || S.replay || S.sot.replay) return;
        e.preventDefault();
        if (e.ctrlKey || e.metaKey)
          zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015));
        else {
          S.camera.x -= e.deltaX;
          S.camera.y -= e.deltaY;
          scheduleRender();
        }
      }

      /* ---------- resize handles ---------- */
      function initResizeHandles() {
        const sel = $("#sel");
        sel.addEventListener("pointerdown", (e) => {
          const h = e.target.closest(".h");
          if (!h) return;
          const el2 = selectionElements()[0];
          if (!el2) return;
          e.stopPropagation();
          pushHistory("resize");
          S.drag = {
            mode: "resize",
            handle: h.dataset.h,
            id: el2.id,
            start: { x: e.clientX, y: e.clientY },
            rect: { x: el2.x, y: el2.y, w: el2.width, h: el2.height },
          };
          pcap(sel, e.pointerId);
        });
        window.addEventListener("pointermove", (e) => {
          if (S.drag && S.drag.mode === "resize") onPointerMove(e);
        });
        window.addEventListener("pointerup", (e) => {
          if (S.drag && S.drag.mode === "resize") onPointerUp(e);
        });
      }

      /* ---------- laser ---------- */
      const laserPoints = [];
      let laserRAF = null;
      function laserAdd(x, y) {
        const c = $("#laser");
        if (!c) return;
        if (c.width !== innerWidth * devicePixelRatio) {
          c.width = innerWidth * devicePixelRatio;
          c.height = innerHeight * devicePixelRatio;
          c.style.width = innerWidth + "px";
          c.style.height = innerHeight + "px";
        }
        laserPoints.push({ x, y, t: performance.now(), life: 650 });
        if (laserPoints.length > 90) laserPoints.shift();
        if (!laserRAF) laserRAF = requestAnimationFrame(laserDraw);
        clearTimeout(laserAdd._timer);
        laserAdd._timer = setTimeout(() => {
          if (!laserPoints.length) {
            const ctx = c.getContext("2d");
            ctx.clearRect(0, 0, innerWidth, innerHeight);
            laserRAF = null;
          }
        }, 900);
      }
      function laserDraw() {
        const c = $("#laser");
        if (!c) {
          laserRAF = null;
          return;
        }
        const ctx = c.getContext("2d");
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        const now = performance.now();
        for (let i = laserPoints.length - 1; i >= 0; i--)
          if (now - laserPoints[i].t > laserPoints[i].life)
            laserPoints.splice(i, 1);
        for (const p of laserPoints) {
          const k = 1 - (now - p.t) / p.life;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 8 * k + 2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(240,86,86,${0.55 * k})`;
          ctx.fill();
        }
        if (laserPoints.length) laserRAF = requestAnimationFrame(laserDraw);
        else laserRAF = null;
      }

      /* ============================================================
   Keyboard
   ============================================================ */
      function onKeyDown(e) {
        const target = e.target;
        if (e.key === "Escape") {
          if (S.present) {
            e.preventDefault();
            return exitPresent();
          }
          if (S.sot.replay) {
            e.preventDefault();
            return sotCloseReplay();
          }
          if (S.replay) {
            e.preventDefault();
            return closeReplay();
          }
          if (
            S.help ||
            S.shortcuts ||
            S.palette ||
            S.exportOpen ||
            S.connectOpen ||
            S.iconSearch ||
            S.renameOpen ||
            S.mermaidOpen
          ) {
            e.preventDefault();
            return closeOverlays();
          }
          if (S.sot.listOpen) {
            e.preventDefault();
            S.sot.listOpen = false;
            renderSotCard();
            renderChrome();
            return;
          }
          if (S.selection.size) {
            e.preventDefault();
            return clearSelection();
          }
        }
        if (S.present) return presentKey(e);
        if (S.sot.replay) {
          if (e.key === "ArrowRight") {
            e.preventDefault();
            return sotSetIndex(S.sot.replay.index + 1);
          }
          if (e.key === "ArrowLeft") {
            e.preventDefault();
            return sotSetIndex(S.sot.replay.index - 1);
          }
          if (e.key === " ") {
            e.preventDefault();
            return sotPlayToggle();
          }
          if (e.key === "Home") {
            e.preventDefault();
            return sotSetIndex(0);
          }
          if (e.key === "End") {
            e.preventDefault();
            const rec = sotReplayRec();
            return sotSetIndex(rec ? rec.frames.length - 1 : 0);
          }
          return;
        }
        if (S.replay) {
          if (e.key === "ArrowRight") return replayStep(1);
          if (e.key === "ArrowLeft") return replayStep(-1);
          if (e.key === " ") {
            e.preventDefault();
            return replayToggle();
          }
          return;
        }
        if (S.palette) {
          const list = filteredCommands();
          if (e.key === "ArrowDown") {
            e.preventDefault();
            S.paletteIndex = clamp(
              (S.paletteIndex || 0) + 1,
              0,
              list.length - 1,
            );
            return renderOverlays();
          }
          if (e.key === "ArrowUp") {
            e.preventDefault();
            S.paletteIndex = clamp(
              (S.paletteIndex || 0) - 1,
              0,
              list.length - 1,
            );
            return renderOverlays();
          }
          if (e.key === "Enter") {
            e.preventDefault();
            const c = list[S.paletteIndex || 0];
            closeOverlays();
            c?.run?.();
            return;
          }
          return;
        }
        if (S.iconSearch) {
          const list = filteredIcons();
          if (e.key === "ArrowDown") {
            e.preventDefault();
            S.iconCursor = clamp((S.iconCursor || 0) + 1, 0, list.length - 1);
            return renderOverlays();
          }
          if (e.key === "ArrowUp") {
            e.preventDefault();
            S.iconCursor = clamp((S.iconCursor || 0) - 1, 0, list.length - 1);
            return renderOverlays();
          }
          if (e.key === "Enter") {
            e.preventDefault();
            const icon = list[S.iconCursor || 0];
            if (icon) runAct("insertIcon", { icon });
            return;
          }
          return;
        }
        if (
          S.connectOpen ||
          S.exportOpen ||
          S.help ||
          S.shortcuts ||
          S.renameOpen
        )
          return;
        if (isTextTarget(target)) return;
        if (e.key === " " && !e.repeat) {
          e.preventDefault();
          S.space = true;
          canvas()?.classList.add("tool-hand");
          return;
        }
        S._shift = e.shiftKey;
        for (const c of COMMANDS) {
          if (e.repeat && !c.repeat) continue;
          if (c.keys.some((k) => keyMatch(e, k))) {
            e.preventDefault();
            c.run();
            return;
          }
        }
      }
      function onKeyUp(e) {
        if (e.key === " ") {
          S.space = false;
          canvas()?.classList.remove("tool-hand");
        }
        if (e.key === "Shift") S._shift = false;
      }
      function keyMatch(e, spec) {
        const parts = spec.split("+");
        const key = parts.pop();
        const mod = parts.includes("Mod"),
          shift = parts.includes("Shift"),
          alt = parts.includes("Alt");
        const mac = /mac/i.test(navigator.platform);
        const cmd = mac ? e.metaKey : e.ctrlKey;
        const other = mac ? e.ctrlKey : e.metaKey;
        if (cmd !== mod || other) return false;
        if (e.altKey !== alt) return false;
        const plain = !["?", "+"].includes(key);
        if (plain && e.shiftKey !== shift) return false;
        const k = e.key;
        if (key.length === 1) return k.toLowerCase() === key.toLowerCase();
        return k === key;
      }
      function presentKey(e) {
        const k = e.key;
        if (
          ["ArrowRight", "ArrowDown", " ", "PageDown", "Enter", "n"].includes(k)
        ) {
          e.preventDefault();
          presentNav(1);
        } else if (
          ["ArrowLeft", "ArrowUp", "PageUp", "Backspace", "p"].includes(k)
        ) {
          e.preventDefault();
          presentNav(-1);
        } else if (k === "Home") {
          e.preventDefault();
          S.present.index = 0;
          S.present.steps = 0;
          renderPresent();
        } else if (k === "End") {
          e.preventDefault();
          S.present.index = slides().length - 1;
          S.present.steps = 0;
          renderPresent();
        } else if (k === "l" || k === "L") {
          S.present.laser = !S.present.laser;
          renderPresent();
        } else if (k === "f" || k === "F") {
          document.documentElement.requestFullscreen?.().catch(() => {});
        }
      }
      function filteredCommands() {
        const q = (S.paletteQ || "").toLowerCase();
        return COMMANDS.filter(
          (c) =>
            !q ||
            c.label.toLowerCase().includes(q) ||
            c.id.includes(q) ||
            (c.group || "").toLowerCase().includes(q),
        );
      }
      function filteredIcons() {
        const q = (S.iconQuery || "").toLowerCase();
        return ICON_LIST.filter((k) => !q || k.includes(q));
      }

      /* ============================================================
   Inputs / delegation
   ============================================================ */
      function initDelegation() {
        document.addEventListener(
          "click",
          (e) => {
            const a = e.target.closest("[data-act]");
            if (!a) return;
            const act = a.dataset.act;
            if (act === "overlayBg") {
              if (e.target === a) closeOverlays();
              return;
            }
            if (act === "noop") return;
            if (act === "replayScrub") return;
            if (act === "toggleBuilds") return;
            if (act === "expBg" || act === "expDark") {
              /* handled by change */
            }
            e.preventDefault();
            e.stopPropagation();
            runAct(act, a.dataset, a);
          },
          true,
        );
        document.addEventListener("change", (e) => {
          const t = e.target;
          if (t.matches("[data-slide-title]")) {
            const sl = S.doc.elements[t.dataset.slideTitle];
            if (sl) {
              pushHistory("rename slide");
              sl.title = t.value.trim() || "Slide";
              persist();
              renderChrome();
            }
            return;
          }
          if (t.matches("[data-notes]")) {
            const sl = S.doc.elements[t.dataset.notes];
            if (sl) {
              pushHistory("notes");
              sl.notes = t.value;
              persist();
            }
            return;
          }
          if (t.matches('[data-act="toggleBuilds"]')) {
            toggleBuilds(t.dataset.slide, t.checked);
            return;
          }
          if (t.matches('[data-act="expBg"]')) {
            S.exportOpts = { ...exportState(), bg: t.checked };
            renderOverlays();
            return;
          }
          if (t.matches('[data-act="expDark"]')) {
            S.exportOpts = { ...exportState(), dark: t.checked };
            renderOverlays();
            return;
          }
        });
        document.addEventListener("input", (e) => {
          const t = e.target;
          if (t.id === "codeArea") {
            S.codeDraft = t.value;
            return;
          }
          if (t.id === "mermaidInput") {
            S.mermaidText = t.value;
            return;
          }
          if (t.id === "sotRange") {
            sotScrub(Number(t.value));
            return;
          }
          if (t.id === "paletteInput") {
            S.paletteQ = t.value;
            S.paletteIndex = 0;
            renderOverlays();
            return;
          }
          if (t.id === "iconSearchInput") {
            S.iconQuery = t.value;
            S.iconCursor = 0;
            renderOverlays();
            return;
          }
          if (t.id === "askInput") return;
          if (t.matches('[data-role="boardSearch"]')) {
            S.boardQuery = t.value;
            renderPanel();
            const inp = $('[data-role="boardSearch"]');
            if (inp) {
              inp.focus();
              inp.setSelectionRange(inp.value.length, inp.value.length);
            }
            return;
          }
          if (t.matches('[data-role="aiModel"]')) {
            S.connectModel = t.value;
            return;
          }
        });
        document.addEventListener("keydown", (e) => {
          const t = e.target;
          if (t.id === "askInput" && e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            const v = t.value;
            t.value = "";
            sendAI(v);
          }
        });
      }

      /* ============================================================
   Images + drop
   ============================================================ */
      function placeImage(dataUrl, naturalW, naturalH) {
        const c = viewportCenter();
        const maxW = 480,
          maxH = 360;
        const k = Math.min(1, maxW / naturalW, maxH / naturalH);
        const w = Math.max(40, naturalW * k),
          h = Math.max(40, naturalH * k);
        const fileId = uid();
        S.doc.files[fileId] = dataUrl;
        pushHistory("add image");
        const el2 = MAKE.image({
          x: Math.round(c.x - w / 2),
          y: Math.round(c.y - h / 2),
          width: Math.round(w),
          height: Math.round(h),
          fileId,
        });
        addElement(el2);
        S.selection = new Set([el2.id]);
        renderAll();
        persist();
      }
      function pickImage() {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.onchange = () => {
          const f = input.files?.[0];
          if (!f) return;
          const fr = new FileReader();
          fr.onload = () => {
            const img = new Image();
            img.onload = () =>
              placeImage(fr.result, img.naturalWidth, img.naturalHeight);
            img.src = fr.result;
          };
          fr.readAsDataURL(f);
        };
        input.click();
      }
      function initDrop() {
        const c = canvas();
        c.addEventListener("dragover", (e) => e.preventDefault());
        c.addEventListener("drop", (e) => {
          e.preventDefault();
          const f = e.dataTransfer?.files?.[0];
          if (!f || !f.type.startsWith("image/")) return;
          const fr = new FileReader();
          fr.onload = () => {
            const img = new Image();
            img.onload = () =>
              placeImage(fr.result, img.naturalWidth, img.naturalHeight);
            img.src = fr.result;
          };
          fr.readAsDataURL(f);
        });
      }

      function pcap(el, id) {
        try {
          el.setPointerCapture?.(id);
        } catch {}
      }

      /* ============================================================
   Boot
   ============================================================ */
      function boot() {
        S.doc = loadDoc();
        S.startOpen = false;
        S.timeline.push({ json: snapshot(), label: "Start", at: Date.now() });
        try {
          const cfg = aiConfig();
          if (cfg.provider) {
            S.assistant.provider = cfg.provider;
            S.assistant.model = cfg.model || AI_META[cfg.provider].model;
          }
        } catch {}
        mountShell();
        initDelegation();
        initResizeHandles();
        initDrop();
        const c = canvas();
        c.addEventListener("pointerdown", onPointerDown);
        c.addEventListener("pointermove", onPointerMove);
        c.addEventListener("pointerup", onPointerUp);
        c.addEventListener("pointercancel", onPointerUp);
        c.addEventListener("dblclick", onDblClick);
        c.addEventListener("wheel", onWheel, { passive: false });
        c.addEventListener("contextmenu", (e) => e.preventDefault());
        document.addEventListener("keydown", onKeyDown);
        document.addEventListener("keyup", onKeyUp);
        window.addEventListener("resize", () => {
          renderCanvas();
          if (S.present) renderPresent();
        });
        window.addEventListener("beforeunload", () => {
          saveBoardCopy();
          persist(true);
        });
        // initial view
        S.camera = { x: 80, y: 80, zoom: 1 };
        renderAll();
        if (elements().length) fitAll();
        if (location.hash.match(/#\/b\//)) toast("Opened board from link");
        else persist(true);
        console.info(
          "%cJojoPen",
          'font:700 16px "Kalam",cursive',
          "— single-file reconstruction",
        );
        window.J = {
          S,
          renderAll,
          addSlide,
          parseDSL,
          layoutDiagram,
          diagramFor,
          openBoard,
          exportSVG,
        };
      }
      document.addEventListener("DOMContentLoaded", boot);
      if (document.readyState !== "loading") boot();

      /* ============================================================
   Sands of Time — recording, replay, GIF/MP4 export
   ============================================================ */
      const sotWait = (ms) => new Promise((r) => setTimeout(r, ms));

      function sotRecList() {
        if (!Array.isArray(S.doc.recordings)) S.doc.recordings = [];
        return S.doc.recordings;
      }
      function sotFmtMs(ms) {
        const s = Math.max(0, ms || 0) / 1000;
        if (s < 1) return "0s";
        if (s < 60) return `${Math.round(s)}s`;
        const m = Math.floor(s / 60),
          r = Math.round(s % 60);
        return `${m}m${r ? " " + r + "s" : ""}`;
      }
      function sotStepWord(n) {
        return `${n} step${n === 1 ? "" : "s"}`;
      }

      /* ---------- recording ---------- */
      function sotToggle() {
        if (S.rec) return sotStop();
        if (S.sot.replay) return sotCloseReplay();
        if (sotRecList().length) {
          S.sot.listOpen = !S.sot.listOpen;
          renderSotCard();
          renderChrome();
          return;
        }
        return sotStart();
      }
      function sotStart() {
        if (S.sot.replay) sotCloseReplay();
        S.sot.listOpen = false;
        S.rec = {
          startedAt: Date.now(),
          steps: 0,
          frames: [{ json: snapshot(), at: 0, label: "Start" }],
          pendingLabel: "",
          timer: null,
        };
        toast("Sands of Time: recording — click the hourglass again to stop");
        renderChrome();
        renderSotCard();
      }
      /* called from pushHistory: remember the intent, the actual frame is captured
   after the edit has settled (see recWatch in renderCanvas). */
      function recCapture(_json, label) {
        if (!S.rec) return;
        /* keep the first label of a burst: "add sticky" is more useful than the
     "edit text" that the text editor pushes right after it. */
        if (label && !S.rec.pendingLabel) S.rec.pendingLabel = label;
      }
      function recWatch() {

      /* ---------- export: shared frame rendering ---------- */
      function sotFrameUnion(rec) {
        const cur = S.doc;

          for (const f of rec.frames) {
            S.doc = normalizeDoc({ ...JSON.parse(f.json), id: cur.id });
            const b = boundsOf(elements());
            if (!b) continue;
            u = u
              ? {
                  minX: Math.min(u.minX, b.minX),
                  minY: Math.min(u.minY, b.minY),
                  maxX: Math.max(u.maxX, b.maxX),
                  maxY: Math.max(u.maxY, b.maxY),

          }

          S.doc = cur;

        return { ...u, width: u.maxX - u.minX, height: u.maxY - u.minY };

      function sotFrameSVG(json, b, pad, W, H) {
        const cur = S.doc;

          S.doc = normalizeDoc({ ...JSON.parse(json), id: cur.id });

            y = b.minY - pad;
          const w = Math.max(1, b.width + pad * 2),
            h = Math.max(1, b.height + pad * 2);

            `<defs><filter id="rough" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/></filter></defs>`,

          parts.push(
            `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${th.board}"/>`,

          h = Math.round(maxSide / aspect);

      function sotGifEncode(width, height, palettes, frames, delays) {

        if (!colors.length) return [{ r: 0, g: 0, b: 0 }];
        if (colors.length <= maxColors)

        let boxes = [colors];
        const channelRange = (box) => {
          let rmin = 255,
            rmax = 0,
            gmin = 255,
            gmax = 0,
            bmin = 255,
            bmax = 0,
            n = 0;
          for (const c of box) {
            rmin = Math.min(rmin, c.r);
            rmax = Math.max(rmax, c.r);
            gmin = Math.min(gmin, c.g);
            gmax = Math.max(gmax, c.g);
            bmin = Math.min(bmin, c.b);
            bmax = Math.max(bmax, c.b);
            n += c.n;
          }
          const ranges = { r: rmax - rmin, g: gmax - gmin, b: bmax - bmin };
          const ch =
            ranges.r >= ranges.g && ranges.r >= ranges.b
              ? "r"
              : ranges.g >= ranges.b
                ? "g"
                : "b";

          let best = -1,
            bestScore = -1;
          for (let i = 0; i < boxes.length; i++) {
            if (boxes[i].length < 2) continue;
            const r = channelRange(boxes[i]);
            const score = r.range * Math.log2(1 + r.n);

            g = 0,
            b = 0,
            n = 0;
          for (const c of box) {
            r += c.r * c.n;
            g += c.g * c.n;
            b += c.b * c.n;
            n += c.n;
          }

            r: Math.round(r / Math.max(1, n)),
            g: Math.round(g / Math.max(1, n)),
