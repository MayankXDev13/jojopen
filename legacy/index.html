        const { b, pad, w, h } = sotSizes(rec, 720);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        const images = [];
        for (let i = 0; i < rec.frames.length; i++) {
          const svg = sotFrameSVG(rec.frames[i].json, b, pad, w, h);
          const img = await sotLoadImage(svgToDataURL(svg));
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = theme().board;
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          images.push(ctx.getImageData(0, 0, w, h).data);
          sotExportProgress((i + 1) / (rec.frames.length + 2));
        }
        const palette = sotPalette(images);
        const indexed = images.map((px) => sotMapToPalette(px, palette));
        sotExportProgress(0.94);
        const bytes = sotGifEncode(w, h, palette, indexed, sotDelays(rec));
        return new Blob([bytes], { type: "image/gif" });
      }

      /* ---------- MP4 (MediaRecorder, H.264) ---------- */
      function sotCanMp4() {
        try {
          return (
            typeof MediaRecorder !== "undefined" &&
            (MediaRecorder.isTypeSupported("video/mp4;codecs=avc1") ||
              MediaRecorder.isTypeSupported("video/mp4"))
          );
        } catch {
          return false;
        }
      }
      async function sotEncodeMp4(rec) {
        const { b, pad, w, h } = sotSizes(rec, 1080);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        const stream = canvas.captureStream(0);
        const track = stream.getVideoTracks()[0];
        const mime = MediaRecorder.isTypeSupported("video/mp4;codecs=avc1")
          ? "video/mp4;codecs=avc1"
          : "video/mp4";
        const recorder = new MediaRecorder(stream, {
          mimeType: mime,
          videoBitsPerSecond: 4_000_000,
        });
        const chunks = [];
        recorder.ondataavailable = (e) => {
          if (e.data && e.data.size) chunks.push(e.data);
        };
        const stopped = new Promise((res, rej) => {
          recorder.onstop = res;
          recorder.onerror = rej;
        });
        recorder.start();
        const delays = sotDelays(rec, 350, 1600);
        const draw = async (i) => {
          const svg = sotFrameSVG(rec.frames[i].json, b, pad, w, h);
          const img = await sotLoadImage(svgToDataURL(svg));
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = theme().board;
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
        };
        for (let i = 0; i < rec.frames.length; i++) {
          await draw(i);
          if (track.requestFrame) track.requestFrame();
          sotExportProgress((i + 1) / (rec.frames.length + 1));
          await sotWait(delays[i]);
        }
        await sotWait(300);
        recorder.stop();
        await stopped;
        try {
          track.stop();
        } catch {}
        return new Blob(chunks, { type: "video/mp4" });
      }

      /* ============================================================
   Mermaid import
   ============================================================ */
      function mermaidSplit(line) {
        const re = /<-->|<->|-\.->|==>|-->|---|--|==/;
        const parts = [],
          conns = [];
        let rest = line;
        for (;;) {
          const m = re.exec(rest);
          if (!m) break;
          parts.push(rest.slice(0, m.index));
          rest = rest.slice(m.index + m[0].length);
          let label = "";
          const lm = /^\s*\|([^|]*)\|/.exec(rest);
          if (lm) {
            label = lm[1].trim();
            rest = rest.slice(lm[0].length);
          }
          conns.push({ conn: m[0], label });
        }
        parts.push(rest);
        return { parts: parts.map((s) => s.trim()).filter(Boolean), conns };
      }
      function mermaidNode(tok) {
        let t = tok
          .trim()
          .replace(/:::[\w-]+/g, "")
          .trim();
        if (!t) return null;
        const m = /^([A-Za-z0-9_.:-]+)\s*([\s\S]*)$/.exec(t);
        let id = m ? m[1] : t;
        let rest = m ? m[2].trim() : "";
        let label = null,
          shape = "rounded";
        if (rest) {
          if (rest.startsWith("((") && rest.endsWith("))")) {
            shape = "ellipse";
            label = rest.slice(2, -2);
          } else if (rest.startsWith("([") && rest.endsWith("])")) {
            shape = "ellipse";
            label = rest.slice(2, -2);
          } else if (rest.startsWith("[(") && rest.endsWith(")]")) {
            shape = "cylinder";
            label = rest.slice(2, -2);
          } else if (rest.startsWith("[[") && rest.endsWith("]]")) {
            shape = "rectangle";
            label = rest.slice(2, -2);
          } else if (rest.startsWith("[/") && rest.endsWith("/]")) {
            shape = "rectangle";
            label = rest.slice(2, -2);
          } else if (rest.startsWith("[") && rest.endsWith("]")) {
            shape = "rectangle";
            label = rest.slice(1, -1);
          } else if (rest.startsWith("(") && rest.endsWith(")")) {
            shape = "rounded";
            label = rest.slice(1, -1);
          } else if (rest.startsWith("{") && rest.endsWith("}")) {
            shape = "diamond";
            label = rest.slice(1, -1);
          } else if (rest.startsWith(">") && rest.endsWith("]")) {
            shape = "rounded";
            label = rest.slice(1, -1);
          } else label = rest;
        }
        label =
          String(label == null ? id : label)
            .replace(/^["']|["']$/g, "")
            .trim() || id;
        return { id, label: label.replace(/<br\s*\/?>/gi, "\n"), shape };
      }
      function mermaidRole(label, shape) {
        const l = label.toLowerCase();
        if (shape === "diamond") return "neutral";
        if (/(redis|cache|memcache|cdn edge)/.test(l)) return "cache";
        if (/(db|database|postgres|mysql|sql|warehouse|store)/.test(l))
          return "data";
        if (/(kafka|queue|topic|rabbit|sqs|pubsub|event bus)/.test(l))
          return "messaging";
        if (/(auth|login|security|lock|key|token)/.test(l)) return "security";
        if (/(user|client|customer|actor|person|browser|mobile)/.test(l))
          return "actor";
        if (/(cdn|network|gateway|proxy|dns|load.?balancer)/.test(l))
          return "network";
        if (
          /(api|server|service|worker|function|lambda|compute|app|backend)/.test(
            l,
          )
        )
          return "compute";
        if (/(cloud|external|stripe|third.?party|saas)/.test(l))
          return "external";
        return "neutral";
      }
      function mermaidToDSL(src) {
        const raw = String(src || "")
          .replace(/^\s*```[a-z]*\s*$/gim, "")
          .replace(/^\s*%%[^\n]*$/gm, "");
        const lines = raw.split(/\r?\n/);
        let direction = "right";
        let header = "Mermaid import";
        const nodes = new Map();
        const edges = [];
        const groups = [];
        let group = null;
        let sawFlow = false;
        const addNode = (n) => {
          if (!n) return;
          if (!nodes.has(n.id)) nodes.set(n.id, { ...n, group });
          else {
            const ex = nodes.get(n.id);
            if (n.label && n.label !== n.id) ex.label = n.label;
            if (n.shape && n.shape !== "rounded") ex.shape = n.shape;
            if (group && !ex.group) ex.group = group;
          }
        };
        for (const rawLine of lines) {
          let line = rawLine.trim();
          if (!line) continue;
          const flow = /^(flowchart|graph)\s+([A-Za-z]{2})/i.exec(line);
          if (flow) {
            sawFlow = true;
            direction =
              { LR: "right", RL: "left", TD: "down", TB: "down", BT: "up" }[
                flow[2].toUpperCase()
              ] || "right";
            continue;
          }
          if (
            /^(classDef|class|style|linkStyle|click|accTitle|accDescr|direction)\b/i.test(
              line,
            )
          )
            continue;
          if (/^subgraph\b/i.test(line)) {
            const g = line.replace(/^subgraph\s+/i, "").trim();
            const m = /^([^\s[]+)\s*\[([\s\S]*)\]$/.exec(g);
            const name = m ? m[2] : g;
            group = {
              id: m ? m[1] : name,
              label: name.replace(/^["']|["']$/g, ""),
            };
            groups.push(group);
            continue;
          }
          if (/^end$/i.test(line)) {
            group = null;
            continue;
          }
          if (
            !sawFlow &&
            /^(sequenceDiagram|classDiagram|stateDiagram|erDiagram|gantt|pie|journey|timeline|mindmap)/i.test(
              line,
            )
          ) {
            return {
              error:
                "This importer handles Mermaid flowcharts. Try “flowchart LR …”.",
            };
          }
          line = line.replace(/--\s+([^|>]+?)\s+-->/g, "-->|$1|");
          line = line.replace(/-\.\s+([^|>]+?)\s+\.->/g, "-.->|$1|");
          const { parts, conns } = mermaidSplit(line);
          if (!parts.length) continue;
          if (!conns.length) {
            addNode(mermaidNode(parts[0]));
            continue;
          }
          const parsed = parts.map((p) =>
            p
              .split(/\s*&\s*/)
              .map(mermaidNode)
              .filter(Boolean),
          );
          let ei = 0;
          for (let i = 0; i < parsed.length - 1; i++) {
            const A = parsed[i],
              B = parsed[i + 1];
            if (!A.length || !B.length) continue;
            const c = conns[ei++] || { conn: "-->", label: "" };
            for (const a of A)
              for (const b of B) {
                addNode(a);
                addNode(b);
                const kind =
                  c.conn === "-.->"
                    ? "optional"
                    : c.conn === "---" || c.conn === "--"
                      ? "line"
                      : c.conn === "<->" || c.conn === "<-->"
                        ? "bidirectional"
                        : "sync";
                edges.push({
                  from: a.id,
                  to: b.id,
                  kind,
                  label: c.label || "",
                });
              }
          }
        }
        if (!nodes.size)
          return {
            error:
              "No nodes found. Paste a flowchart, e.g. “flowchart LR / A[Start] --> B[End]”.",
          };
        const byId = new Map();
        const used = new Set();
        const nameFor = (n) => {
          if (byId.has(n.id)) return byId.get(n.id);
          let base =
            n.label
              .replace(/[\[\]{}]/g, "")
              .replace(/\s+/g, " ")
              .trim() || n.id;
          let name = base,
            k = 2;
          while (used.has(name)) name = `${base} ${k++}`;
          used.add(name);
          byId.set(n.id, name);
          return name;
        };
        const decl = (n) => {
          const name = nameFor(n);
          const role = mermaidRole(n.label, n.shape);
          let shape = n.shape;
          if (role === "data" || role === "cache") shape = "cylinder";
          return `${name} [${shape}, ${role}]`;
        };
        const top = [...nodes.values()].filter((n) => !n.group);
        const groupIds = new Set(groups.map((g) => g.id));
        const inGroup = (g) =>
          [...nodes.values()].filter((n) => n.group && n.group.id === g.id);
        let out = `title: ${header}\ndirection: ${direction}\n\n`;
        for (const n of top) out += decl(n) + "\n";
        for (const g of groups) {
          const kids = inGroup(g);
          if (!kids.length) continue;
          out +=
            `\ngroup ${g.label.replace(/[{}]/g, "")} {\n` +
            kids.map((n) => "  " + decl(n)).join("\n") +
            "\n}\n";
        }
        void groupIds;
        if (edges.length) {
          out += "\n";
          for (const e of edges) {
            const arrow =
              e.kind === "optional"
                ? "-.->"
                : e.kind === "line"
                  ? "---"
                  : e.kind === "bidirectional"
                    ? "<->"
                    : "->";
            out += `${nameFor(nodes.get(e.from))} ${arrow} ${nameFor(nodes.get(e.to))}${e.label ? ": " + e.label : ""}\n`;
          }
        }
        return { dsl: out };
      }
      function mermaidOpen() {
        S.mermaidOpen = true;
        if (!S.mermaidText) {
          S.mermaidText =
            "flowchart LR\n  Browser[Browser] --> CDN[CDN]\n  CDN --> API(API gateway)\n  API --> DB[(URL database)]\n  API --> Cache[(Redis cache)]\n  API -.-> Queue[Kafka queue]";
        }
        S.mermaidError = "";
        renderOverlays();
      }
      function mermaidConvert() {
        const src = $("#mermaidInput")?.value ?? S.mermaidText;
        S.mermaidText = src;
        const res = mermaidToDSL(src);
        if (res.error) {
          S.mermaidError = res.error;
          renderOverlays();
          return;
        }
        S.mermaidError = "";
        S.mermaidOpen = false;
        pushHistory("import mermaid");
        S.selection.clear();
        S.codeFor = null;
        S.codeDraft = res.dsl;
        const parsed = parseDSL(res.dsl);
        const layout = layoutDiagram(parsed);
        const el = MAKE.diagram({
          x: 80,
          y: 80,
          width: Math.max(240, layout.width),
          height: Math.max(180, layout.height),
          title: parsed.title || "Imported diagram",
          dsl: res.dsl,
        });
        addElement(el);
        S.selection = new Set([el.id]);
        S.codeFor = el.id;
        renderOverlays();
        renderAll();
        renderPanel();
        persist();
        fitAll();
        toast("Converted Mermaid to a diagram");
      }
      function mermaidHTML() {
        return `<div class="scrim" data-act="overlayBg"><div class="modal wide" role="dialog" aria-label="Import Mermaid">
    <header><h2>Import Mermaid</h2><button class="iconbtn" data-act="closeOverlay">${ico("close", 18)}</button></header>
    <div class="modal-body">
      <p class="note" style="margin-top:0">Paste a Mermaid flowchart. Node shapes, labels, dashed links and subgraphs are converted to JojoPen's diagram language.</p>
      <textarea class="input codearea" id="mermaidInput" spellcheck="false" aria-label="Mermaid source" style="min-height:230px">${esc(S.mermaidText || "")}</textarea>
      ${S.mermaidError ? `<div class="diag error">${esc(S.mermaidError)}</div>` : ""}
      <p class="note">Supported: <code>flowchart LR|RL|TD|TB</code>, <code>A[Box]</code>, <code>A(Round)</code>, <code>A((Circle))</code>, <code>A{Decision}</code>, <code>A[(Database)]</code>, <code>--&gt;</code>, <code>-.-></code>, <code>---</code>, <code>|labels|</code> and <code>subgraph</code>.</p>
      <div class="row end" style="margin-top:14px">
        <button class="secondary" data-act="closeOverlay">Cancel</button>
        <button class="primary" data-act="mermaidConvert">${ico("check", 15)} Convert to diagram</button>
      </div>
    </div>
  </div></div>`;
      }

      /* ============================================================
   Slide builds
   ============================================================ */
      function toggleBuilds(id, checked) {
        const sl = S.doc.elements[id];
        if (!sl || sl.type !== "slide") return;
        pushHistory("builds");
        sl.builds = checked ? slideChildren(sl).map((e) => e.id) : [];
        persist();
        renderPanel();
        renderAll();
        toast(
          checked
            ? `Builds on · ${sotStepWord(sl.builds.length)}`
            : "Builds off",
        );
      }
      function buildAdd(id, mode) {
        const sl = S.doc.elements[id];
        if (!sl) return;
        const selected = selectionElements()
          .filter((e) => e.frameId === id && e.id !== id)
          .map((e) => e.id);
        const ids = selected.length
          ? selected
          : slideChildren(sl).map((e) => e.id);
        if (!ids.length) return toast("Draw something on the slide first");
        pushHistory(mode === "highlight" ? "highlight build" : "appear build");
        const ex = new Set(sl.builds || []);
        for (const x of ids) ex.add(x);
        sl.builds = [...ex];
        persist();
        renderPanel();
        renderAll();
        toast(
          `${mode === "highlight" ? "Highlight" : "Appear"} build added · ${sotStepWord(sl.builds.length)}`,
        );
      }
      function buildReplay(id) {
        const sl = S.doc.elements[id];
        if (!sl) return;
        if (!(sl.builds || []).length)
          sl.builds = slideChildren(sl).map((e) => e.id);
        else sl.builds = slideChildren(sl).map((e) => e.id);
        const idx = slides().findIndex((s) => s.id === id);
        present(Math.max(0, idx));
        if (S.present) {
          S.present.steps = 0;
          renderPresent();
        }
      }

      /* Scrub without replacing the range input mid-drag. */
      function sotScrub(value) {
        const rp = S.sot.replay,
          rec = sotReplayRec();
        if (!rp || !rec) return;
        rp.index = clamp(Number(value) || 0, 0, rec.frames.length - 1);
        const frame = rec.frames[rp.index];
        if (!rp.union) rp.union = sotFrameUnion(rec);
        const scene = sotSceneFrom(frame.json, rp.union);
        const vw = innerWidth,
          vh = innerHeight;
        const scale = Math.min((vw - 180) / scene.w, (vh - 220) / scene.h, 1.5);
        const stage = document.querySelector(".sotstage");
        if (stage) {
          stage.style.width = scene.w * scale + "px";
          stage.style.height = scene.h * scale + "px";
          stage.innerHTML = `<div class="scene" style="width:${scene.w}px;height:${scene.h}px;transform:scale(${scale});transform-origin:0 0">${scene.html}</div>`;
        }
        const pos = document.querySelector(".sotpos");
        if (pos) pos.textContent = `${rp.index}/${rec.frames.length - 1}`;
        const label = document.querySelector(".sotlabel");
        if (label)
          label.textContent = rp.index === 0 ? "Start" : frame.label || "Edit";
        const prev = document.querySelector('[data-act="sotPrev"]');
        const next = document.querySelector('[data-act="sotNext"]');
        if (prev) prev.disabled = rp.index === 0;
        if (next) next.disabled = rp.index >= rec.frames.length - 1;
      }

      /* New diagram in the code panel. */
      function newDiagram() {
        S.selection.clear();
        S.codeFor = null;
        S.codeDraft = `title: New diagram
direction: right

Client [actor]
API [compute]
Database [data]

Client -> API: request
API -> Database: read`;
        if (S.panel === "code") renderPanel();
        else setPanel("code");
        toast("New diagram — edit the code, then Apply");
      }
    </script>
  </body>
